<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  AC — REEL CREATOR · black-and-gold animated reel engine (deterministic seek(t))
  ============================================================================
  FRONT-LOADED reel. Sub-12s. Payoff-first, loud open (no fade from black),
  one visual "moment" per scene, loop callback, a FLAT black ground with no
  background effects of any kind, and a progress bar whose position is the
  theme's signature. Synced sound.
  TO MAKE A NEW VIDEO edit only: (1) the CONTENT object and (2) the THEME
  constant, both near the bottom. Do NOT change the SCENES timings unless you
  also update the cue times in reel_audio.py, or the sound desyncs.
  ============================================================================
-->
<style>
/* ===== DISPLAY FACES — one per theme. Files live in canvas-fonts; if you move this
   template, copy the .ttf files next to it and update these paths. ===== */
/* POPPINS — added 2026-08-21 (Day 38). The template referenced font-family:'Poppins'
   in every small-type rule (kicker, sub, chip, arrow, watermark, subtitle, tagline) but
   NEVER declared a @font-face for it and shipped no Poppins file, so it silently resolved
   to the system fallback — a SERIF in this renderer. Brand law is "Poppins for all small
   type", and the whole look depends on one display serif set against a geometric sans;
   with both layers serif the typographic contrast collapses, which is exactly why frames
   read flat. Four weights are used across the engine: 400 sub, 500 watermark, 600 kicker,
   700 chip/arrow. */
@font-face{font-family:'Poppins';font-weight:400;src:url('fonts/Poppins-400.ttf');}
@font-face{font-family:'Poppins';font-weight:500;src:url('fonts/Poppins-500.ttf');}
@font-face{font-family:'Poppins';font-weight:600;src:url('fonts/Poppins-600.ttf');}
@font-face{font-family:'Poppins';font-weight:700;src:url('fonts/Poppins-700.ttf');}
@font-face{font-family:'DispBase';src:url('fonts/Gloock-Regular.ttf');}
@font-face{font-family:'DispCrest';src:url('fonts/BricolageGrotesque-Bold.ttf');}
@font-face{font-family:'DispColumn';src:url('fonts/Italiana-Regular.ttf');}
@font-face{font-family:'DispMargin';src:url('fonts/InstrumentSerif-Italic.ttf');}
@font-face{font-family:'DispVault';src:url('fonts/Marcellus.woff2') format('woff2');}
  :root{
    --black:#0A0A0A; --gold:#E7C765; --gold-deep:#C9A23F; --gold-light:#F4DF95;
    --white:#F4F0E7; --stone:#B9B1A1; --grey:#6f6a60;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A;}
  /* FLAT GROUND. One value, no gradient, no glow, no grain, no mark. If you are
     tempted to add anything behind the type, don't. */
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A0A0A;--disp:'Lora';}
  #frame{position:absolute;inset:46px;border:1.5px solid rgba(231,199,101,0.34);}
  #frame2{display:none;position:absolute;inset:46px;border:1.5px solid rgba(10,10,10,0.38);}
  .tick{position:absolute;width:44px;height:44px;opacity:0;}
  .tick.tl{top:34px;left:34px;border-top:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.tr{top:34px;right:34px;border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  .tick.bl{bottom:34px;left:34px;border-bottom:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.br{bottom:34px;right:34px;border-bottom:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  #wm{position:absolute;bottom:645px;left:0;width:100%;text-align:center;
    font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;letter-spacing:6px;font-size:24px;color:rgba(231,199,101,0.5);}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:150px 110px 230px;text-align:center;visibility:hidden;}
  .el{opacity:0;will-change:transform,opacity,clip-path;}
  /* ===== MOTION VOCABULARY, added 2026-08-21 (Day 38, AC's call) ===============
     The engine's whole language was fade + translate + one odometer scale, so no
     amount of retiming could change how a reel LOOKED. These three moves add craft
     without touching brand law: flat ground, one gold idea, no glow, no gradient
     on the ground. All three are transform/clip only, so the renderer stays cheap.
     ---------------------------------------------------------------------------- */
  /* masked digit slide — each character rides up into its own clipped window.
     Reads as a mechanical odometer landing. Critically it NEVER shows a false
     value: the character slides in from empty space, it does not count through
     wrong digits, so it composes with the never-counts guard instead of fighting it. */
  /* padding+negative margin extends the CLIP box below the baseline without changing
     layout height, so descenders (g, y, p) survive the overflow:hidden the mask needs. */
  /* HORIZONTAL BLEED (AC, 2026-08-24) - .odc had bottom bleed only, so glyph ink
     that overhangs its ADVANCE box was shorn off on the left and right. Measured on
     the stress string "$725B": margin lost 63.7px of ink, base 51.2px, vault 10.2px,
     column 2.0px (crest was clean). That is the sliced figure AC flagged. Two separate
     clippers had to be widened, which is why bleeding the mask alone did not fix it:
       1. .odc overflow:hidden  - shears the ink outright;
       2. .odc>i background-clip:text with a transparent fill - the glyph is painted
          ONLY where the gradient box covers it, so ink outside that box renders
          invisible even with the mask open.
     Both get the same 0.16em bleed, cancelled by an equal negative margin, so layout
     and the cue-driven cascade are byte-identical. TOP stays clipped deliberately:
     that edge is the masked reveal the digits descend through, and bleeding it would
     leak the incoming glyph early. Re-measured after: 0.0px lost on all five themes. */
  .odc{display:inline-block;overflow:hidden;line-height:1;vertical-align:bottom;
    padding:0 0.16em 0.24em;margin:0 -0.16em -0.24em;}
  .odc>i{display:inline-block;font-style:normal;will-change:transform;
    padding:0 0.16em;margin:0 -0.16em;}
  /* a word space set at display size is enormous — "Aug 2" opened a hole between the
     word and the figure. Narrow it optically; text-size word spacing does not scale. */
  .odc.sp{width:0.24em;}
  /* .gold paints its glyphs with background-clip:text + color:transparent, which only
     works when the TEXT is a direct child. setOdo nests each character in .odc>i, so the
     children inherited transparency with no background of their own and the whole figure
     rendered invisible (caught by gate 7 on the first build, 2026-08-21). Re-apply the
     fill at glyph level. Per-character gradients read as a sheen on each digit rather than
     one sweep across the figure, which suits a mechanical odometer. */
  .gold .odc>i{background:linear-gradient(118deg,#F4DF95 0%,#E7C765 46%,#C9A23F 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  /* themes that flatten the gold fill must flatten the nested glyphs too */
  #stage.t-column .onGold.odometer .odc>i{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#0A0A0A;color:#0A0A0A;}
  /* drawn gold rule — the strike-through move (already in scene B) promoted to a
     reusable element, so a line can draw itself under or above a claim. The gradient is
     SYMMETRIC: a one-sided fade under centre-aligned content reads as a mistake. */
  .grule{height:3px;border-radius:2px;transform-origin:left center;will-change:transform;
    background:linear-gradient(90deg,rgba(231,199,101,0.10) 0%,var(--gold) 26%,var(--gold) 74%,rgba(231,199,101,0.10) 100%);}

  .kicker{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:29px;letter-spacing:7px;color:var(--gold);text-transform:uppercase;}
  .kicker .dot{color:rgba(231,199,101,0.5);margin:0 10px;}
  .livedot{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--gold);
    margin-right:16px;vertical-align:middle;box-shadow:0 0 14px var(--gold);}
  .h1{font-family:var(--disp),'Lora';font-weight:600;font-size:82px;line-height:1.26;color:var(--white);letter-spacing:-0.5px;}
  .h1.sm{font-size:70px;line-height:1.34;}
  .gold{background:linear-gradient(118deg,#F4DF95 0%,#E7C765 46%,#C9A23F 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(231,199,101,0.16));}
  .sub{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:37px;line-height:1.4;color:var(--stone);max-width:820px;}
  .sub b{color:var(--white);font-weight:600;}

  .odometer{font-family:var(--disp),'Lora';font-weight:700;font-size:150px;line-height:1;letter-spacing:-3px;
    margin:10px 0 14px;}

  /* B — build/use toggle */
  .toggle{display:flex;align-items:center;gap:34px;}
  .chip{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:46px;letter-spacing:3px;padding:16px 42px;border-radius:14px;
    text-transform:uppercase;position:relative;}
  .chip.build{color:var(--stone);border:2.5px solid rgba(185,177,161,0.5);}
  .chip.use{color:#0A0A0A;background:linear-gradient(118deg,#F4DF95,#C9A23F);border:2.5px solid var(--gold);
    box-shadow:0 0 44px rgba(231,199,101,0.28);}
  .arrow{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:52px;color:var(--gold);}
  .strike{position:absolute;left:22px;right:22px;top:calc(50% - 3px);height:6px;border-radius:4px;
    background:linear-gradient(90deg,#F4DF95,#C9A23F);transform-origin:left center;transform:scaleX(0);}

  /* C — news stamp chip */
  .newschip{margin-top:30px;font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:31px;letter-spacing:1px;color:var(--gold);
    border:2px solid var(--gold);border-radius:12px;padding:13px 28px;box-shadow:0 0 30px rgba(231,199,101,0.16);}

  /* E — CTA */
  .mono{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp),'Lora';font-weight:600;font-size:74px;color:var(--gold);}
  .mono svg{position:absolute;inset:0;}
  .handle{font-family:var(--disp),'Lora';font-weight:600;font-size:80px;margin-bottom:10px;}
  /* transform-origin is BOTTOM CENTRE so the scene-E step-forward grows him up
     from his own feet instead of ballooning from the middle. Set here, never
     animated by CSS — figTick(t) writes the transform on every seek. */
  .acfig{position:absolute;left:104px;top:288px;width:150px;z-index:7;
         transform-origin:50% 100%;will-change:transform;}
  /* the subtitle is his speech: it shifts right of him and left-aligns */
  #stage.hasfig #subline{text-align:left;padding:0 110px 0 274px;}
  /* column drops its caption to the lower black half; he follows it down */
  #stage.t-column.hasfig .acfig{top:auto;bottom:180px;}
  /* NO CSS TRANSITION on the caret. It is driven by seek(t) and must resolve
     instantly: a transition makes rendering time-dependent, which breaks frame
     determinism AND makes the ink gate see phantom ink on every element
     (measured 2026-08-13 — it reported 10 false overlaps in scene A). */
  .acfig .fst{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:7.2;stroke-linecap:round;stroke-linejoin:round;}
  .acfig .fth{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;}
  /* hair crown sits between the two weights: heavy enough to read as a mass at
     140px, light enough that it does not compete with the head rim at 7.2 */
  .acfig .fhr{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:6;stroke-linecap:round;stroke-linejoin:round;}
  .acfig .fsun{fill:var(--figstroke,var(--gold));}
  .acfig .fcar{fill:var(--gold-light,#F4DF95);}
  #stage.light{--figstroke:#12100A;}
  .loopcur{font-family:'Poppins','Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:32px;letter-spacing:3px;color:rgba(231,199,101,0.62);}

  /* ===== t-vault — the 3D-native theme, soft-launched Day 38 (decision 2026-08-23).
   The floor grid IS the theme's block: baked from the approved lab geometry
   (cand_vault), it grounds every scene; the progress rail rides the floor's
   front edge. Marcellus face. The mark opens scene A and signs scene E. ===== */
#stage.t-vault{--disp:'DispVault';}
#stage.t-vault{--vbg:url('baked-vault/vault_floor.png');}
#stage.t-vault:before{content:'';position:absolute;inset:0;
  background:var(--vbg) center/cover no-repeat;z-index:0;}
#stage.t-vault .scene{justify-content:center;padding:466px 110px 620px;}
#stage.t-vault #A{padding-top:500px;}
#stage.t-vault #progress{left:120px;right:120px;bottom:648px;height:12px;
  background:rgba(231,199,101,0.14);border-radius:6px;overflow:hidden;}
#stage.t-vault #progress i{height:100%;background:linear-gradient(90deg,#F4DF95,#C9A23F);}
#stage.t-vault #wm{top:208px;bottom:auto;left:96px;right:auto;transform:none;text-align:left;}
#stage.t-vault .tick.bl,#stage.t-vault .tick.br{opacity:1;}
#stage.t-vault .h1{font-size:56px;letter-spacing:0.5px;}
#stage.t-vault .h1.sm{font-size:50px;}
#stage.t-vault .odometer{font-size:210px;letter-spacing:-2px;}
#stage.t-vault .kicker{letter-spacing:7px;}
/* C's figure carries a word suffix; 210px wraps it mid-word */
#stage.t-vault #C .odometer{font-size:138px;letter-spacing:0;}
/* E: the sting mark owns the centre; the sign-off text stands under it on the floor */
#stage.t-vault #E{justify-content:flex-end;padding-bottom:648px;}
/* the mark assembling over scene A (baked particle frames, transparent) */
#markopen{position:absolute;top:96px;left:50%;transform:translateX(-50%);
  width:224px;height:246px;z-index:4;display:none;pointer-events:none;}
#stage.t-vault #markopen{display:block;}
#stage.t-crest #markopen{display:block;top:104px;}
#race{position:absolute;left:0;top:985px;width:1080px;height:315px;z-index:2;
  display:none;pointer-events:none;}
#stage.t-crest #race{display:block;}
#stage.t-crest #E{padding-left:60px;padding-right:60px;}
#stage.t-crest #E .h1{font-size:72px;}
#stage.t-crest #subline{top:900px;bottom:auto;}
#signoff{position:absolute;left:50%;top:660px;transform:translateX(-50%);
  width:224px;height:246px;z-index:4;display:none;opacity:0;pointer-events:none;}
#stage.t-crest #signoff{display:none;}
#markopen img{position:absolute;inset:0;width:100%;height:100%;opacity:0;}
/* scene E: the sting is the ground; the monogram circle retires on vault */
#sting{position:absolute;inset:0;z-index:1;display:none;}
#sting img{position:absolute;inset:0;width:100%;height:100%;opacity:0;}
#stage.t-vault #E{z-index:2;}
#stage.t-vault #E .mono{display:none;}
#stage.t-crest .h1{font-size:96px;letter-spacing:0.5px;}
  #stage.t-crest .h1.sm{font-size:84px;}
  #stage.t-crest .odometer{font-size:172px;letter-spacing:-1px;}
  #stage.t-column .h1{font-size:74px;letter-spacing:2px;line-height:1.24;}
  #stage.t-column .h1.sm{font-size:64px;}
  #stage.t-column .odometer{font-size:158px;letter-spacing:0px;}
  #stage.t-margin .h1{font-size:90px;}
  #stage.t-margin .h1.sm{font-size:78px;}
  #stage.t-margin .odometer{font-size:164px;letter-spacing:-2px;}

  /* ===== PROGRESS BAR — position is the theme's signature ===== */
  #progress{position:absolute;border-radius:3px;background:rgba(231,199,101,0.13);
    z-index:3;pointer-events:none;overflow:hidden;}
  #progress i{display:block;width:0;height:0;border-radius:3px;
    box-shadow:0 0 14px rgba(231,199,101,0.4);}

/* ==================================================================
   THE FOUR THEMES — structure, not light. One rule generates all four:
   THE CORNER TICKS MARK THE EDGE THE BAR RUNS ALONG.
   Type composition shifts to balance whichever edge is loaded.
   ================================================================== */

  /* I · BASE — bar along the bottom, type optically centred. The default. */
  /* ==================================================================
     THE FOUR THEMES · v5
     Each one must be nameable from a thumbnail. The progress indicator IS
     the theme's block: where it sits and how much mass it carries is the
     identity. Hierarchy, type case and colour balance all move with it.
     ================================================================== */
  #stage.t-base  {--disp:'DispBase';  background:linear-gradient(0deg,#131313 0%,#0A0A0A 58%);}
  #stage.t-crest {--disp:'DispCrest'; background:#0A0A0A;}
  #stage.t-margin{--disp:'DispMargin';background:linear-gradient(270deg,#141414 0%,#0A0A0A 58%);}
  #stage.t-column{--disp:'DispColumn';
    background:linear-gradient(180deg,#EFD68A 0%,#E3C061 36%,#D3AC49 50%,#0F0F0F 50%,#0A0A0A 100%);}

  /* ===== PROGRESS INDICATOR — full bleed, and it is the block ===== */
  #progress{position:absolute;border-radius:0;z-index:3;pointer-events:none;overflow:hidden;
    background:rgba(231,199,101,0.09);}
  #progress i{display:block;width:0;height:0;border-radius:0;}

/* ---------------------------------------------------------------- I · BASE
   The number is the hero. Gold dominant. A heavy gold bar seals the floor. */
  /* base's bar sealed the FILE's floor, which the Instagram player covers: the bottom
     ~620px is chrome, so the block that IS this theme's identity was invisible in the
     app on every base post ever shipped. Logged since Day 24, declined twice as optional,
     fixed 2026-08-17 because it had blocked base out of the News rotation entirely and
     left only two usable themes. It now seals the floor of the VISIBLE frame instead. */
  #stage.t-base #progress{left:0;right:0;bottom:620px;height:26px;background:rgba(231,199,101,0.16);}
  /* the bar now occupies y1274-1300, which is where the watermark used to sit, so the
     watermark lifts clear for this theme only. */
  #stage.t-base #wm{bottom:700px;}
  #stage.t-base #progress i{height:100%;background:linear-gradient(90deg,#F4DF95,#C9A23F);}
  #stage.t-base .tick.bl,#stage.t-base .tick.br{opacity:1;}
  #stage.t-base .scene{justify-content:center;padding:150px 110px 400px;} /* 260->320 on 2026-08-21 (Day 38): base lifts #wm to bottom:700px to clear its own
     floor bar, which squeezes the watermark (y1193..1220) against the scene-C chip.
     The chip enters on a 1.5x stamp, so its BOX inflates downward at entry and gate 6
     collided on frames where the settled chip clears fine. Scenes are centre-justified,
     so trimming copy only lifts the foot by half what it removes; +60px of floor padding
     moves the whole block up 30px in one move and keeps the app chrome clear. */
  #stage.t-base .h1{font-size:54px;}
  #stage.t-base .h1.sm{font-size:50px;}
  /* hero figure — keep it to 5 characters or fewer ($725B, 66%, 280x) */
  #stage.t-base .odometer{font-size:276px;letter-spacing:-9px;}
  #stage.t-base .sub{font-size:33px;}

/* --------------------------------------------------------------- II · CREST
   The headline is the hero, set in caps. White dominant. A gold band grows
   across the ceiling; that band is the progress indicator. */
  #stage.t-crest #progress{left:0;right:0;top:0;height:82px;background:rgba(231,199,101,0.17);}
  #stage.t-crest #progress i{height:100%;background:linear-gradient(90deg,#EFD68A,#D3AC49);}
  #stage.t-crest #frame{top:118px;}
  #stage.t-crest .tick.tl{top:106px;}#stage.t-crest .tick.tr{top:106px;}
  #stage.t-crest .tick.tl,#stage.t-crest .tick.tr{opacity:1;}
  #stage.t-crest .scene{justify-content:center;padding:340px 160px 1080px;}
  /* caps are wide: 106px keeps a 16-char line clear of the frame */
  #stage.t-crest .h1{font-size:88px;line-height:1.20;text-transform:uppercase;letter-spacing:-1px;}
  #stage.t-crest .h1.sm{font-size:80px;line-height:1.26;}
  #stage.t-crest .h1.gold{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#F4F0E7;color:#F4F0E7;filter:none;}
  #stage.t-crest .odometer{font-size:112px;letter-spacing:-2px;margin-bottom:30px;padding-bottom:6px;}
  #stage.t-crest .sub{font-size:32px;}

/* -------------------------------------------------------------- III · COLUMN
   The frame splits. Gold owns the ceiling, black the floor, and black becomes
   the accent above the fold. The bar runs the full left edge, two-tone. */
  #stage.t-column #frame{clip-path:inset(50% 0 0 0);}
  #stage.t-column #frame2{display:block;clip-path:inset(0 0 50% 0);}
  #stage.t-column #progress{left:0;top:0;bottom:0;width:14px;
    background:linear-gradient(180deg,rgba(10,10,10,0.20) 0 50%,rgba(231,199,101,0.10) 50% 100%);}
  #stage.t-column #progress i{width:100%;background-repeat:no-repeat;background-size:14px 1920px;
    background-image:linear-gradient(180deg,#0A0A0A 0 50%,#F4DF95 50% 100%);}
  #stage.t-column .tick.tl{opacity:1;border-color:rgba(10,10,10,0.72);}
  #stage.t-column .tick.bl{opacity:1;}
  #stage.t-column .scene{justify-content:center;padding:150px 110px 230px 190px;}
  #stage.t-column .h1{font-size:74px;letter-spacing:2px;line-height:1.24;}
  #stage.t-column .h1.sm{font-size:64px;}
  #stage.t-column .odometer{font-size:158px;letter-spacing:0px;}

/* -------------------------------------------------------------- IV · MARGIN
   Everything flush left and set lowercase; stone dominant, one gold figure.
   A heavy gold rule hard against the right edge. */
  #stage.t-margin #progress{right:0;top:0;bottom:0;width:22px;background:rgba(231,199,101,0.16);}
  #stage.t-margin #progress i{width:100%;background:linear-gradient(180deg,#F4DF95,#C9A23F);}
  #stage.t-margin .tick.tr,#stage.t-margin .tick.br{opacity:1;}
  #stage.t-margin .scene{justify-content:center;align-items:flex-start;text-align:left;
    padding:150px 210px 230px 128px;}
  #stage.t-margin .toggle{align-self:flex-start;}
  #stage.t-margin .sub{max-width:690px;font-size:32px;}
  /* italic, NOT lowercase: text-transform would turn $725B into $725b */
  #stage.t-margin .h1{font-size:72px;color:#B9B1A1;letter-spacing:0px;line-height:1.34;}
  #stage.t-margin .h1.sm{font-size:66px;}
  /* OPENER=contrast — scene A only. Skip rate is decided by what the eye can read at
     thumb speed, and the display serif is the least legible thing on the canvas. Set
     const OPENER='contrast' to switch it on. Measured against the control from 17 Aug. */
  #stage.op-contrast #A .h1, #stage.op-contrast #A .h1.sm, #stage.op-contrast #A .h1.sm.gold{
    font-family:'Poppins',sans-serif !important; font-weight:700 !important;
    font-style:normal !important; font-size:96px !important; line-height:1.08 !important;
    letter-spacing:-2.5px !important;}

<script>
/* ===== HANDLE — your reel handle, stamped on EVERY frame (footer watermark)
   AND the CTA card. This is the ONE place it is set. Change this single line to
   switch handles everywhere (e.g. '@itsac.ai'). Do not hardcode it elsewhere. ===== */
const HANDLE='@itsac.ai';

/* ===========================  CONTENT  (EDIT THIS)  ===========================
   The ONLY per-video block, together with the THEME constant just below it.
   Replace EVERY field with your verified story before building. Rules: payoff in
   scene A, ONE real number per scene, no em-dashes on screen, big Lora lines
   <= ~16 chars. For an AI-news story keep hook.kicker as 'Breaking · AI' and use
   proof.chip as the news stamp. Full slot guide: references/reel-scenes.md and references/themes.md
   The slots below are NEUTRAL MASTER COPY, not a story. Every field must be
   replaced before rendering. If you see the word "here" on screen, you shipped
   the blank template.
   ============================================================================ */
const CONTENT={
  monogram:'AC',
  hook:{ kicker:'Breaking · AI',
         line1:'A ROBOT BEAT', line2:'USAIN BOLT.',
         num:{value:9.39, decimals:2, prefix:'', suffix:'s', whole:true},
         label:'Beijing, Saturday. The record stood 17 years.' },
  shift:{ kicker:'Here\u2019s the shift', from:'21.50s', to:'9.39s',
          line1:'Same race.', line2:'One year.' },
  proof:{ kicker:'The proof',
          num:{value:9.58, decimals:2, prefix:'', suffix:'s', whole:true},
          label:'<b>Bolt still holds the human record.</b><br>He jogged a lap. It left on a stretcher.',
          chip:'Humanoid Robot Games · 22 Aug' },
  rule:{ line1:'FAST IS NOT', line2:'FINISHED.',
         sub:'AI wins the sprint. <span class="gold">You own the finish.</span>' },
  cta:{ handle:HANDLE, tagline:'Daily AI · no hype, no jargon',
        loop:'a robot beat usain bolt \u2192 _' }
};

const THEME='crest';

/* ===== FIGURE — the AC narrator mark. FINALISED 2026-08-13 through a design
   interview with AC. 'off' | 'on'. DEFAULT 'on' — AC's standing rule
   2026-08-21 ("just one video, with subs, with the AC figure"): every video
   ships with the narrator unless a run explicitly opts out.
   THE CANONICAL MARK (do not redraw casually): akimbo stance, head tilted 5
   degrees; eye-level sunglasses WITH temple arms (armless bars read as a visor
   — measured 2026-08-13); ONE raised brow above the right lens (the sceptic's
   face; first draft merged with the head rim and read as a hair flick — keep
   the brow clear of the rim); caret mouth, the page's typed-caret signature —
   he does not speak, he types; polo collar with button dot, the ONLY body
   detail (the watch was cut: two accessories read as costume); NO feet ticks
   (AC's call); stroke 7.2 main / 6 hair / 4.6 detail, the poster cut.
   HAIR added 2026-08-13 — variant T3 "tousled", AC's pick from an 8-variant
   sheet. Judged at 140px, not at full size: hair drawn as separate fine
   strands (tousled, textured crop) dissolves into fuzz at reel scale, so what
   survives is anything that changes the SILHOUETTE. Four uneven strands do.
   He has NO NAME — he is AC drawn, captions say "me".
   NARRATOR MODE (2026-08-13, AC's call): he is PERSISTENT across all five
   scenes, standing in the subtitle band, and THE TYPED SUBTITLE IS HIS SPEECH.
   He is a sibling of the scenes, not inside one, so he never fades between
   cuts. His mouth caret is driven by the real subtitle clock in subTick():
   bright while the line is typing, dim between lines — so he actually talks
   for the whole 11.7s using copy that already exists and is already gated.
   Chose the subtitle band because it is the one horizontal lane no scene's
   content enters; putting him beside the scene copy would have forced every
   headline to re-wrap.
   Enters via standard data-a machinery; light look via --figstroke. Static
   caret; seek-driven blink is future work. Source sheets: assets/figure/. */
const FIGURE='on';

/* OPENER — 'default' | 'contrast'. See the op-contrast block in the CSS. */
const OPENER='default';

/* ===== TRANSITION — how one scene becomes the next (AC, 2026-08-24) =========
   Every mode here is GHOST-FREE, by one of two different means, and the
   distinction is the whole point:

     by OPACITY  - only ONE scene is ever painted, so a fade has to pass through
                   black. There is no such thing as a zero-overlap cross-fade: a
                   fade-out that touches a fade-in IS two scenes on screen at once,
                   which is exactly the ghosting this engine was fixed to remove.
     by GEOMETRY - both scenes paint, but into DISJOINT regions, so no pixel ever
                   carries two scenes. This is how you get a soft-feeling move
                   without a dissolve.

   SCENES timings are untouched in every mode, so audio cue maps still match.
   Times are seconds. Scene A never fades in (loud-open law) and the last scene
   never fades out (loop seam). ========================================== */
const TRANSITION='cut';   // 'cut' | 'fade' | 'dip' | 'wipe' | 'slide' | 'bar'
const TRANS={
  cut:   {by:'opacity', out:0.00, in:0.00, hold:0.00},
  fade:  {by:'opacity', out:0.13, in:0.17, hold:0.00},
  dip:   {by:'opacity', out:0.14, in:0.18, hold:0.10},
  wipe:  {by:'geometry', dur:0.26},
  slide: {by:'geometry', dur:0.28},
  bar:   {by:'geometry', dur:0.30}
};

/* ===== SCENE TIMINGS (fixed — audio cues in reel_audio.py match these) ===== */
const SCENES=[
  {id:'A',start:0.0,dur:2.7},{id:'B',start:2.6,dur:2.5},{id:'C',start:5.0,dur:2.6},
  {id:'D',start:7.5,dur:2.2},{id:'E',start:9.6,dur:1.8}
];

/* ===== helpers ===== */
function el(cls,html,a,st){return '<div class="'+cls+' el"'+(a?' data-a="'+a+'"':'')+(st?' style="'+st+'"':'')+'>'+(html||'')+'</div>';}
function fmt(cur,spec){let s; if(spec.decimals>0){s=cur.toLocaleString('en-US',{minimumFractionDigits:spec.decimals,maximumFractionDigits:spec.decimals});}else{s=Math.round(cur).toLocaleString('en-US');} return (spec.prefix||'')+s+(spec.suffix||'');}
const C=CONTENT;
const dot='<span class="livedot"></span>';

/* ===== BUILD SCENE DOM ===== */
const root=document.getElementById('scenes');
root.innerHTML=`
<div id="markopen"><img data-k='0' src='baked-vault/open_00.png'><img data-k='1' src='baked-vault/open_01.png'><img data-k='2' src='baked-vault/open_02.png'><img data-k='3' src='baked-vault/open_03.png'><img data-k='4' src='baked-vault/open_04.png'><img data-k='5' src='baked-vault/open_05.png'><img data-k='6' src='baked-vault/open_06.png'><img data-k='7' src='baked-vault/open_07.png'><img data-k='8' src='baked-vault/open_08.png'><img data-k='9' src='baked-vault/open_09.png'><img data-k='10' src='baked-vault/open_10.png'><img data-k='11' src='baked-vault/open_11.png'><img data-k='12' src='baked-vault/open_12.png'><img data-k='13' src='baked-vault/open_13.png'><img data-k='14' src='baked-vault/open_14.png'><img data-k='15' src='baked-vault/open_15.png'><img data-k='16' src='baked-vault/open_16.png'><img data-k='17' src='baked-vault/open_17.png'><img data-k='18' src='baked-vault/open_18.png'><img data-k='19' src='baked-vault/open_19.png'></div>
<div class="scene" id="A">
  ${el('kicker',dot+C.hook.kicker,'-0.3,0.25,fade')}
  <div style="height:12px"></div>
  ${el('h1 sm',C.hook.line1,'-0.3,0.25,up')}
  ${el('h1 sm gold',C.hook.line2,'-0.22,0.28,up')}
  <div style="height:30px"></div>
  <!-- NO inline font-size here. It used to carry style="font-size:134px", which beats
       every '#stage.t-<theme> .odometer' rule on specificity, so scene A's figure rendered
       at 134px in EVERY theme while scene C's obeyed the theme (276px in base). base exists
       to make the figure the hero; its loud open was shipping that hero at under half size.
       Measured 2026-08-21: odoA 134px vs odoC 276px on the same theme. -->
  ${el('grule','','0.62,0.55,rule','width:300px;margin:6px 0 26px')}
  <div class="odometer gold" id="odoA">$0.0B</div>
  ${el('sub',C.hook.label,'1.62,0.45,rise','margin-top:64px')}
</div>
<div class="scene" id="B">
  ${el('kicker',C.shift.kicker,'-0.2,0.28,fade')}
  <div style="height:34px"></div>
  <div class="toggle">
    <div class="chip build el" data-a="0.0,0.28,pop">${C.shift.from}<div class="strike" id="strikeB"></div></div>
    <div class="arrow el" data-a="0.72,0.28,pop">&rarr;</div>
    <div class="chip use el" data-a="0.95,0.28,pop">${C.shift.to}</div>
  </div>
  <div style="height:44px"></div>
  ${el('h1 sm',C.shift.line1,'1.5,0.58,wipe','color:var(--stone);font-size:54px')}
  ${el('h1 sm gold',C.shift.line2,'1.6,0.58,wipe','font-size:54px')}
</div>
<div class="scene" id="C">
  ${el('kicker',C.proof.kicker,'-0.2,0.28,fade')}
  <div style="height:16px"></div>
  <div class="odometer gold" id="odoC">0</div>
  <!-- label moved 1.4 -> 0.8 and chip 1.62 -> 1.55 (2026-08-14, Day 30). Scene C
       used to land its kicker at 0.4 and then show nothing new until 1.4, so a full
       second of the scene rested on the odometer alone - and a counting number, however
       big it looks, is too small a share of a 1080x1920 mostly-black frame to clear
       freezedetect at -50dB. That one gap was gate 4's last failure. Landing the label
       while the number is still climbing also just reads better: the explanation arrives
       with the count instead of after it. -->
  ${el('sub',C.proof.label,'0.8,0.45,rise')}
  <div style="height:28px"></div>
  <!-- an EMPTY chip must not render: the element carries a gold border, padding and a
       glow, so a blank one shipped an empty box AND pushed the block into the watermark.
       Found 2026-08-17 when a run legitimately had no second proof point. -->
  ${C.proof.chip ? el('newschip',C.proof.chip,'1.55,0.45,stamp') : ''}
</div>
<div class="scene" id="D">
  ${el('h1',C.rule.line1,'-0.2,0.58,wipe','color:var(--stone)')}
  ${el('h1 gold',C.rule.line2,'-0.1,0.58,wipe')}
  ${el('grule','','0.42,0.62,rule','width:190px;margin-top:22px')}
  <div style="height:30px"></div>
  ${el('sub',C.rule.sub,'0.9,0.45,rise')}
</div>
<div class="scene" id="E">
  <div class="mono el" data-a="-0.2,0.45,pop"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" pathLength="1" style="fill:none;stroke:var(--gold);stroke-width:2.5"/></svg>${C.monogram}</div>
  ${el('handle gold',C.cta.handle,'0.45,0.58,wipe')}
  ${el('kicker',C.cta.tagline,'0.85,0.45,rise')}
  <div style="height:26px"></div>
  <div class="loopcur el" id="loopc" data-a="1.2,0.28,fade">${C.cta.loop}</div>
</div>
`;

/* The AC figure — canonical mark, RIGGED for animation (2026-08-13).
   Arms are two-bone: upper bone drawn along +x from the shoulder and rotated by
   S; forearm pivots at the elbow and is rotated by E. That makes a gesture a
   pair of angles rather than a redrawn path, so poses can be interpolated.
   Named hooks the animator drives: #f-body #f-head #f-mouth #f-armL #f-armR.
   Everything is set from figTick(t) — never CSS animation. */
function acArm(id,S,E){
  return '<g id="'+id+'" transform="translate(105,128) rotate('+S+')">'+
    '<path class="fst" d="M0 0 L46 0"/>'+
    '<g class="fore" transform="translate(46,0) rotate('+E+')">'+
    /* The forearm bone lives in its OWN group so it can be scaled along its
       length (foreshortening, for the point-at-camera) without squashing the
       hand. The hand is r=0 in every normal pose — this mark has no hands. It
       only exists when the arm comes AT the viewer, where a limb shortening
       toward you with nothing on the end reads as an amputation, not a point. */
    '<g class="forescale"><path class="fst" d="M0 0 L38 0"/></g>'+
    '<circle class="fhand fsun" cx="38" cy="0" r="0"/></g></g>';
}
function acFigure(){
  if(typeof FIGURE==='undefined'||FIGURE==='off')return '';
  /* HAIR — T3 "tousled", AC's pick from an eight-variant sheet (2026-08-13).
     Crown arc plus four strands of unequal height and lean; the unevenness is
     the whole point, a symmetrical set reads as a crown, not hair. Drawn INSIDE
     the head group so it tilts with the 5-degree head lean and rides every nod.
     Spike tips sit above the viewBox (y as low as -6) — the svg carries
     overflow:visible for exactly this reason, do not remove it. */
  const hair='<path class="fhr" d="M64 40 Q70 9 105 8 Q141 9 146 40"/>'+
    '<path class="fth" d="M76 20 l4 -11"/><path class="fth" d="M92 11 l-2 -11"/>'+
    '<path class="fth" d="M110 8 l6 -10"/><path class="fth" d="M128 14 l9 -6"/>';
  const head='<g id="f-head" transform="rotate(-5 105 104)">'+
    '<circle cx="105" cy="58" r="46" class="fst"/>'+hair+
    '<path class="fth" d="M113 38 Q123 33 133 37"/>'+
    '<rect x="74" y="45" width="26" height="14" rx="6" class="fsun"/>'+
    '<rect x="110" y="45" width="26" height="14" rx="6" class="fsun"/>'+
    '<path class="fth" d="M100 51 h10"/><path class="fth" d="M74 50 L61 46"/><path class="fth" d="M136 50 L149 46"/>'+
    '<rect id="f-mouth" x="100" y="80" width="10" height="5" rx="2.5" class="fcar"/></g>';
  const torso='<path class="fth" d="M89 108 L96 122 L105 118"/><path class="fth" d="M121 108 L114 122 L105 118"/>'+
    '<circle cx="105" cy="127" r="2.5" class="fsun"/><path class="fst" d="M105 104 v92"/>';
  const legs='<path class="fst" d="M105 196 L86 258"/><path class="fst" d="M105 196 L132 256"/>';
  return '<div class="acfig"><svg width="150" height="207" viewBox="0 0 210 290" style="overflow:visible">'+
    '<g id="f-body">'+head+torso+acArm('f-armL',132,-108)+acArm('f-armR',72,14)+legs+'</g></svg></div>';
}

/* ===== ENGINE ===== */
function clamp(p){return Math.min(1,Math.max(0,p));}
function eOut(p){p=clamp(p);return 1-Math.pow(1-p,3);}
function eBack(p){p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
/* eSoft — eBack with the overshoot dialled from ~10% to ~4% (2026-08-21, Day 38).
   The motion-design pass put this brand in the PREMIUM archetype (elegant, minimal,
   0% overshoot); ~10% is the PLAYFUL band and it read as bounce on a page whose whole
   look is stillness. 4% still registers as an onset without the bounce. eBack is KEPT
   for 'stamp': a rubber stamp is meant to overshoot, and a badge is Light weight,
   where 5-15% is in spec. */
function eSoft(p){p=clamp(p);const c1=0.7,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function eExpo(p){p=clamp(p);return p>=1?1:1-Math.pow(2,-10*p);}
function lerp(a,b,p){return a+(b-a)*p;}
function applyA(node,lt){
  const s=node.dataset.a.split(','),d=parseFloat(s[0]),du=parseFloat(s[1]),t=s[2];
  const p=(lt-d)/du,e=eOut(p),b=eBack(p),sf=eSoft(p);let tr='';
  if(t==='wipe'){
    /* masked type reveal: the line is uncovered left to right by a clip window while
       it settles the last few px. Opacity is NOT ramped — the mask does the reveal,
       which is what separates this from a fade. */
    tr='translateY('+((1-e)*8).toFixed(2)+'px)';
    node.style.clipPath='inset(-0.18em '+((1-e)*100).toFixed(2)+'% -0.30em 0)';
    node.style.opacity=(p>0?1:0);node.style.transform=tr;return;
  }
  if(t==='rule'){ node.style.opacity=(p>0?1:0);node.style.transform='scaleX('+e.toFixed(4)+')';return; }
  if(t==='rise')tr='translateY('+((1-e)*26).toFixed(2)+'px)';
  else if(t==='up')tr='translateY('+((1-e)*48).toFixed(2)+'px)';
  else if(t==='left')tr='translateX('+((1-e)*-50).toFixed(2)+'px)';
  else if(t==='pop')tr='scale('+lerp(0.72,1,sf).toFixed(3)+')';
  else if(t==='stamp')tr='rotate(-5deg) scale('+lerp(1.5,1,b).toFixed(3)+')';
  node.style.opacity=clamp(p);node.style.transform=tr;
}

SCENES.forEach(s=>{s.el=document.getElementById(s.id);s.anims=[...s.el.querySelectorAll('[data-a]')];});
const odoA=document.getElementById('odoA'),odoC=document.getElementById('odoC');
/* setOdo — paint the figure as per-character masked columns and ride each one up on a
   left-to-right cascade. The DOM is rebuilt only when the STRING changes, so a counting
   figure still animates its digits without thrashing the renderer every frame. */
function setOdo(node,text,p){
  if(node.dataset.txt!==text){
    node.dataset.txt=text;
    node.innerHTML=[...String(text)].map(ch=>
      '<span class="odc'+(ch===' '?' sp':'')+'"><i>'+(ch===' '?'&nbsp;':ch.replace('&','&amp;').replace('<','&lt;'))+'</i></span>').join('');
  }
  const kids=node.querySelectorAll('.odc>i'), N=kids.length||1;
  kids.forEach((k,i)=>{
    const d=i*0.055, q=eOut((p-d)/Math.max(0.28,1-d));
    /* glyphs DESCEND into place rather than rising. Same masked reveal, but the
       in-flight box travels UP into empty frame instead of DOWN into Instagram's
       action-rail band — gate 6 measures element rects and cannot see that the
       parent's overflow:hidden already clips that ink, so rising glyphs tripped it
       on every frame of the entry. Descending keeps the measurement honest and the

       into a soft landing, and on the way out the same curve applied to the REMAINING
       fraction reads as a gentle start into a fast departure. Second dividend: a
       shorter, accelerated exit sharpens the cut, which is the gate-3 ENGINE DEBT
       logged on Day 37 — measured on Day 38 at row-decorrelation 0.404 against a
       0.150 threshold, where Day 37 read 0.020. Checked at every cut: the incoming
       scene is ~80% up as the outgoing one reaches zero, so no cut dips to black.
       SCENES timings are untouched, so reel_audio.py's cue map still matches. */
    /* HARD CUT - zero overlap (AC, 2026-08-24). Every scene owns the HALF-OPEN
       window [start, cut), where cut is the next scene's start. The outgoing scene
       is gone on the exact frame the incoming one appears, so no two scenes are ever
       painted in the same frame. What this replaces: the scene windows in SCENES
       genuinely overlap (a scene's start+dur runs past the next scene's start), and
       the cross-fade rendered BOTH scenes through that window - measured at 9 of 10
       sampled cut moments, each scene at 0.2-0.36 opacity. That is two full-bleed
       layouts stacked on top of each other AND a luminance dip at every cut. It is
       the ghosting AC flagged (a headline reading through the next scene's kicker).
       Element entrances still carry the motion through data-a, so a cut reads as a
       cut, not as a jump. The last scene holds through the render tail (loop seam),
       so the reel closes on a full frame instead of dying to black - required here,
       because without it a hard cut would leave the tail empty.
       SCENES timings are UNTOUCHED, so every audio cue map still matches. */
    const st=t-s.start,isLast=(i===LAST);
    const cut=isLast?(s.start+s.dur):Math.min(s.start+s.dur,SCENES[i+1].start);
    /* In geometry modes the OUTGOING scene overhangs the cut for the length of the
       move, because a wipe or a slide needs something to wipe away. It is still
       ghost-free: the two scenes are clipped or translated into disjoint regions,
       verified by measuring per-pixel ink overlap, not by counting live scenes. */
    const endAt=isLast?Infinity:(cut+(__GEO?__TD:0));
    const live=(st>=-0.0001)&&t<endAt-0.0001;
    let op=live?1:0, clipS='none', extra='';
    if(live&&!__GEO){
      /* fade in from this scene's own start; fade out so it is FULLY gone before
         the cut (minus any deliberate hold on black), never across it */
      if(!(s.start<=0.0001)&&__M.in>0) op*=eOut(clamp(st/__M.in));
      if(!isLast&&__M.out>0){ const gone=cut-__M.hold; op*=eOut(clamp((gone-t)/__M.out)); }
    } else if(live&&__GEO){
      const inU=clamp(st/__TD), outU=clamp((t-cut)/__TD);
      if(!(s.start<=0.0001)&&inU<1){                       // this scene is arriving
        /* whole PIXELS, not percentages, and the two halves are split with a 1px
           guard: at exactly u*100% on both sides the boundary column belongs to
           both scenes and antialiasing puts real ink from each into it (measured:
           53 shared pixels). */
        if(__M===TRANS.wipe)  clipS='inset(0 '+(1080-Math.round(inU*1080))+'px 0 0)';
        if(__M===TRANS.slide) extra=' translateX('+((1-inU)*1080).toFixed(1)+'px)';
        if(__M===TRANS.bar)   op=(inU<0.5?0:1);
      }
      if(!isLast&&t>=cut&&outU<=1){                        // this scene is leaving
        if(__M===TRANS.wipe)  clipS='inset(0 0 0 '+(Math.round(outU*1080)+1)+'px)';
        if(__M===TRANS.slide) extra=' translateX('+(-outU*1080).toFixed(1)+'px)';
        if(__M===TRANS.bar)   op=(outU<0.5?1:0);
      }
    }
    const vis=op>0.002?1:0;
    s.el.style.opacity=op;
    s.el.style.visibility=op>0.002?'visible':'hidden';
    s.el.style.clipPath=clipS; s.el.style.webkitClipPath=clipS;
    /* SETTLE, then a slow continuous PUSH-IN for the rest of the scene.
       Found 2026-08-14 (Day 30): gate 4 had been passing on the scene FADES, not on
       content. The moment the loop-seam fix above removed the last fade, four windows
       over 1.0s appeared at once — scenes were going genuinely static as soon as their
       one animation finished, and the cross-fades were papering over it. A 3% push-in
       keeps every frame alive without adding a single noisy element, which is the calm
       way to hold a floor on a page whose whole look is stillness. Bounds are safe: the
       scenes carry 150px/110px padding and gates 1, 2 and 6 are re-run against it. */
    const settle=lerp(1.03,1,clamp(st/0.35));
    const push=1+0.03*clamp((st-0.35)/Math.max(0.35,s.dur-0.35));
    s.el.style.transform=op>0.002?('scale('+(settle*push).toFixed(4)+')'+extra):'none';
    if(op>0.002)sceneAnim(s,st);
  });
};
window.seek(0);document.title='ready';
</script>

    const ant=quad(col); setQuad(ant,[0.04,0.097],[0.062,0.170],0.011,0.008,0.005); head.add(ant);
  }else{
    head=disc(C.head,0.125); head.scale.set(0.90,1.14,1);

const ROBOT=buildFigure('robot',{torso:GOLD,limb:GOLD,head:GOLD,foot:GOLD});
const HUMAN=buildFigure('human',{torso:JGREEN,limb:STONE,head:STONE,foot:GOLD});

/* widths: the human is tapered and athletic, the robot is blockier and even */
const Wm={human:{tor:[0.205,0.120],ua:[0.080,0.058],la:[0.058,0.040],
                 th:[0.112,0.076],sh:[0.076,0.044],ft:[0.044,0.026],nk:[0.056,0.050]},
          robot:{tor:[0.185,0.140],ua:[0.070,0.066],la:[0.058,0.052],
                 th:[0.094,0.084],sh:[0.078,0.066],ft:[0.048,0.034],nk:[0.052,0.048]}};
function paint(F,J,z){
  const w=Wm[F.kind], L=F.L;
  setQuad(L.torso,J.sho,J.hip,w.tor[0],w.tor[1],z);
  setQuad(L.neck,[J.sho[0],J.sho[1]],[J.head[0],J.head[1]-0.10],w.nk[0],w.nk[1],z);
  setQuad(L.ua1,J.sho,J.elb1,w.ua[0],w.ua[1],z); setQuad(L.la1,J.elb1,J.hnd1,w.la[0],w.la[1],z);
  setQuad(L.ua2,J.sho,J.elb2,w.ua[0],w.ua[1],z); setQuad(L.la2,J.elb2,J.hnd2,w.la[0],w.la[1],z);
  setQuad(L.th1,J.hip,J.kne1,w.th[0],w.th[1],z); setQuad(L.sh1,J.kne1,J.ank1,w.sh[0],w.sh[1],z);
  setQuad(L.th2,J.hip,J.kne2,w.th[0],w.th[1],z); setQuad(L.sh2,J.kne2,J.ank2,w.sh[0],w.sh[1],z);
  setQuad(L.ft1,J.ank1,J.toe1,w.ft[0],w.ft[1],z); setQuad(L.ft2,J.ank2,J.toe2,w.ft[0],w.ft[1],z);

  F.caps.forEach((m,i)=>{m.position.set(cp[i][0],cp[i][1],z+0.004);});

  if(F.kit){
    const sh=J.sho, hp=J.hip;
    const mx=(a,b,f)=>[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
    // gold saltire band across the singlet (the flag's cross, worn as kit)
    const dx=hp[0]-sh[0], dy=hp[1]-sh[1], LL=Math.hypot(dx,dy)||1e-6;
    const px=-dy/LL, py=dx/LL;                       // across-body axis
    const a=[sh[0]+px*0.150+dx*0.10, sh[1]+py*0.150+dy*0.10];
    const b=[hp[0]-px*0.130-dx*0.06, hp[1]-py*0.130-dy*0.06];

    // black waistband seals the singlet against the legs
    setQuad(F.kit.band, mx(sh,hp,0.88), mx(sh,hp,1.06), 0.122, 0.116, z+0.010);
    // gold headband
    const hd=J.head;
    setQuad(F.kit.hair,[hd[0]-0.104,hd[1]+0.098],[hd[0]+0.104,hd[1]+0.098],0.050,0.050,z+0.011);
    setQuad(F.kit.hb,[hd[0]-0.108,hd[1]+0.040],[hd[0]+0.108,hd[1]+0.040],0.026,0.026,z+0.013);
  }
}
const HIP=[0,1.14], SHO=[0.05,1.90];
function jointsRun(ph){
  const p=ph, S=Math.sin(p), S2=Math.sin(p+Math.PI);
  // hip swing is wide; knee tucks ONLY on the forward (recovery) leg, so the
  // trailing leg extends straight behind - that is what reads as a sprint.
  const hA1=S*1.10, hA2=S2*1.10;
  const kF1=0.16+2.00*Math.max(0,S), kF2=0.16+2.00*Math.max(0,S2);
  const sA1=S2*0.95, sA2=S*0.95;
  const EL=1.52;                                   // sprinters hold ~90deg elbows
  const TH=0.58, SH=0.56, UA=0.35, LA=0.33;
  const elb1=[SHO[0]+Math.sin(sA1)*UA,SHO[1]-Math.cos(sA1)*UA];
  const elb2=[SHO[0]+Math.sin(sA2)*UA,SHO[1]-Math.cos(sA2)*UA];
  const hnd1=[elb1[0]+Math.sin(sA1+EL)*LA,elb1[1]-Math.cos(sA1+EL)*LA];
  const hnd2=[elb2[0]+Math.sin(sA2+EL)*LA,elb2[1]-Math.cos(sA2+EL)*LA];
  const kne1=[HIP[0]+Math.sin(hA1)*TH,HIP[1]-Math.cos(hA1)*TH];
  const kne2=[HIP[0]+Math.sin(hA2)*TH,HIP[1]-Math.cos(hA2)*TH];
  const ank1=[kne1[0]+Math.sin(hA1-kF1)*SH,kne1[1]-Math.cos(hA1-kF1)*SH];
  const ank2=[kne2[0]+Math.sin(hA2-kF2)*SH,kne2[1]-Math.cos(hA2-kF2)*SH];
  return {sho:SHO,hip:HIP,head:[SHO[0]+0.085,SHO[1]+0.255],
    elb1,hnd1,elb2,hnd2,
    kne1,ank1,toe1:[ank1[0]+0.26+Math.max(0,-S)*0.06,ank1[1]-0.045],
    kne2,ank2,toe2:[ank2[0]+0.26+Math.max(0,-S2)*0.06,ank2[1]-0.045]};
}
function jointsDown(u){
  const e=1-Math.pow(1-Math.min(1,u),3);
  const hipY=1.14-e*0.98, shoY=1.90-e*1.50, shoX=0.05+e*0.40;
  const sho=[shoX,shoY], hip=[0,hipY];
  const elb1=[sho[0]+0.36+e*0.10,sho[1]-0.20+e*0.06];
  const elb2=[sho[0]+0.12,sho[1]-0.40+e*0.22];
  const kne1=[hip[0]-0.48,hipY-0.16], kne2=[hip[0]-0.42,hipY+0.24];
  const ank1=[hip[0]-0.94,hipY-0.02], ank2=[hip[0]-0.88,hipY+0.30];
  return {sho,hip,head:[sho[0]+0.15+e*0.20,sho[1]+0.255-e*0.18],headRot:-e*1.15,
    elb1,hnd1:[sho[0]+0.70+e*0.16,sho[1]-0.30+e*0.16],
    elb2,hnd2:[sho[0]+0.48,sho[1]-0.46+e*0.34],
    kne1,ank1,toe1:[hip[0]-1.08,hipY+0.14],
    kne2,ank2,toe2:[hip[0]-1.02,hipY+0.44]};
}
function jointsStand(u){
  const e=1-Math.pow(1-Math.min(1,u),2);
  const up=0.34+e*0.86;
  const elb1=[SHO[0]+0.40, SHO[1]-0.12+up*0.44];
  const elb2=[SHO[0]-0.38, SHO[1]-0.12+up*0.44];
  return {sho:SHO,hip:HIP,head:[SHO[0]+0.02,SHO[1]+0.265],
    elb1,hnd1:[SHO[0]+0.66+e*0.10, SHO[1]+0.10+up*0.52],
    elb2,hnd2:[SHO[0]-0.62-e*0.10, SHO[1]+0.10+up*0.52],
    kne1:[-0.27,0.58],ank1:[-0.35,0.02],toe1:[-0.61,-0.02],
    kne2:[0.25,0.60],ank2:[0.31,0.02],toe2:[0.57,-0.02]};
}
const ZR=0.62, ZH=-0.92, YH=0.42;
[[ZR,0.55,0],[ZH,0.34,YH]].forEach(([z,op,yy])=>{
  const g=new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(-4.6,yy,z),new THREE.Vector3(2.9,yy,z)]);
  s.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:DIM,transparent:true,opacity:op})));
});
const PADX=1.62, pad=new THREE.Group(); s.add(pad);
{const pts=[],H=1.76,W=0.30;
 for(let i=0;i<=10;i++){const x=PADX+(i/10)*W; pts.push(new THREE.Vector3(x,0,ZR),new THREE.Vector3(x,H,ZR));}

{const g=new THREE.BufferGeometry().setFromPoints(

 s.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:STONE,transparent:true,opacity:0.34})));}

  else{const u=(t-H_RUN)/(1-H_RUN); hx=STOPX+u*0.30;
    HUMAN.G.rotation.z=0; paint(HUMAN,jointsStand(u),ZH);}
  HUMAN.G.position.set(hx,YH,0);

  pad.scale.x=1-flex*0.22; pad.children[0].material.opacity=0.42+flex*0.5;

};
