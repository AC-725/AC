<!DOCTYPE html><html><head><meta charset="UTF-8">
<script type="importmap">{"imports":{"three":"../../three.module.min.js"}}</script>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="gl" width="1080" height="1920"></canvas>
<script type="module">
/* MOVE · dolly — the rule beat. Camera pushes in while FOV widens - subject holds, ground stretches.
 *
 * Baked to assets/baked-moves/dolly_NN.png at 1080x1920 RGBA (transparent), which is the
 * CSS box the slot actually uses - NOT the full 1080x1920 frame. The mark open already
 * proves the pattern: 720x792 frames in a 224x246 box. Baking at slot size is what keeps
 * a registry of moves from becoming hundreds of megabytes of PNG.
 *
 * Contract: window.__TOTAL / window.seek(t) / window.__READY, same as render_frames.js,
 * so this file also drops straight into the reel engine if the live route is taken. */
import * as THREE from 'three';
import { PALETTE, stage } from '../../lib/vault.js';
import { dolly } from '../../lib/moves.js';

const W = 1080, H = 1920;
const { renderer, scene, camera } = stage(THREE, document.getElementById('gl'),
  { w: W, h: H, fov: 50, alpha: true });
camera.position.set(0, 0.4, 8.2);
camera.lookAt(0, -0.4, 0);

/* The dolly drives the CAMERA, so it needs something with depth to read against.
 * The vault floor is already the theme's ground, so the move reads as the room moving. */
import { vaultFloor } from '../../lib/vault.js';
import { shell } from '../../lib/moves.js';
scene.add(vaultFloor(THREE));

/* THE SUBJECT. Without it the dolly is invisible - the first bake had only the floor and
 * frame 0 was indistinguishable from frame 19. This card sits at the subject plane (z=0),
 * holds its on-screen size for the whole move, and lets the floor stretch behind it.
 * In the reel it is the scene-D rule card, with the DOM copy sitting on top of it. */
const subject = shell(THREE, 2.9, 1.25, 0.09);
subject.position.set(0, 0.35, 0);
scene.add(subject);

const move = dolly(camera, { z0: 8.2, z1: 4.6, fov0: 50 });

window.__TOTAL = 1;
window.seek = (t) => {
  move.at(Math.min(1, Math.max(0, t)));
  renderer.render(scene, camera);
};
window.seek(0);
window.__READY = true; document.title = 'ready';
</script></body></html>
