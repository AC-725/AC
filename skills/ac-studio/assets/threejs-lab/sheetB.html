<!DOCTYPE html><html><head><meta charset="UTF-8">
<script type="importmap">{"imports":{"three":"./three.module.min.js","three/addons/":"./jsm/"}}</script>
<style>
@font-face{font-family:'Poppins';font-weight:600;src:url('fonts/Poppins-600.ttf');}
@font-face{font-family:'DispBase';src:url('fonts/Gloock-Regular.ttf');}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1200px;height:2040px;background:#0A0A0A;overflow:hidden;}
.grid{display:grid;grid-template-columns:600px 600px;}
.cell{position:relative;width:600px;height:680px;background:#0A0A0A;border:1px solid rgba(231,199,101,0.10);}
.lbl{position:absolute;top:22px;left:0;width:100%;text-align:center;
  font-family:'Poppins';font-weight:600;font-size:18px;letter-spacing:4px;color:#E7C765;text-transform:uppercase;}
.note{position:absolute;bottom:18px;left:0;width:100%;text-align:center;
  font-family:'Poppins';font-weight:600;font-size:14px;color:#6f6a60;}
canvas{position:absolute;left:100px;top:110px;width:400px;height:420px;}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="lbl">7 · AC figure in 3D</div><canvas id="c7" width="800" height="840"></canvas><div class="note">rigged from primitives · canonical pose</div></div>
  <div class="cell"><div class="lbl">8 · Product mockup</div><canvas id="c8" width="800" height="840"></canvas><div class="note">built from primitives · NO GLTF offline</div></div>
  <div class="cell"><div class="lbl">9 · Type dissolve</div><canvas id="c9" width="800" height="840"></canvas><div class="note">mid-morph · 21 becoming 65</div></div>
  <div class="cell"><div class="lbl">10 · Depth of field</div><canvas id="c10" width="800" height="840"></canvas><div class="note">real bokeh · BokehPass</div></div>
  <div class="cell"><div class="lbl">11 · Camera flight</div><canvas id="c11" width="800" height="840"></canvas><div class="note">camera inside the word</div></div>
  <div class="cell"><div class="lbl">Reference</div><canvas id="c12" width="800" height="840"></canvas><div class="note">current flat 2D figure, for comparison</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
const GOLD=0xE7C765;
function mk(id,fov=34,z=6){
  const canvas=document.getElementById(id);
  const r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  r.setSize(800,840,false);
  const s=new THREE.Scene();
  const c=new THREE.PerspectiveCamera(fov,800/840,0.1,100); c.position.z=z;
  return {r,s,c};
}
function eOut(p){p=Math.min(1,Math.max(0,p));return 1-Math.pow(1-p,3);}
const gMat=new THREE.MeshBasicMaterial({color:GOLD});

/* ---- 7 · AC FIGURE, built as real 3D from primitives -------------------
   Matches the canonical mark: akimbo stance, head tilted ~5deg, sunglasses
   with temple arms, polo collar dot, caret mouth, NO feet ticks. Capsules and
   spheres, unlit flat gold, so it stays inside the current look while being
   genuinely dimensional and posable.                                       */
const F=mk('c7',34,7.2); const fig=new THREE.Group();
function limb(x1,y1,z1,x2,y2,z2,rad){
  const a=new THREE.Vector3(x1,y1,z1),b=new THREE.Vector3(x2,y2,z2);
  const d=new THREE.Vector3().subVectors(b,a), len=d.length();
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(rad,len-rad*2,6,12),gMat);
  m.position.copy(a).add(d.clone().multiplyScalar(0.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  fig.add(m); return m;
}
const head=new THREE.Mesh(new THREE.SphereGeometry(0.52,28,22),
  new THREE.MeshBasicMaterial({color:GOLD,wireframe:false}));
head.position.set(0,1.72,0); head.rotation.z=0.09; fig.add(head);
// glasses: a dark band across the head with temple arms
const band=new THREE.Mesh(new THREE.BoxGeometry(0.92,0.15,0.10),new THREE.MeshBasicMaterial({color:0x0A0A0A}));
band.position.set(0,1.80,0.46); band.rotation.z=0.09; fig.add(band);
[-1,1].forEach(s=>{const t=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.07,0.34),new THREE.MeshBasicMaterial({color:0x0A0A0A}));
  t.position.set(s*0.45,1.80,0.30); fig.add(t);});
// caret mouth
const caret=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.05,0.05),new THREE.MeshBasicMaterial({color:0x0A0A0A}));
caret.position.set(0,1.55,0.50); fig.add(caret);
limb(0,1.20,0,0,0.10,0,0.14);                    // torso
limb(0,1.02,0,-0.62,0.55,0.10,0.10); limb(-0.62,0.55,0.10,-0.55,1.02,0.10,0.09); // L arm akimbo
limb(0,1.02,0, 0.62,0.55,0.10,0.10); limb( 0.62,0.55,0.10, 0.55,1.02,0.10,0.09); // R arm akimbo
limb(0,0.10,0,-0.30,-1.25,0,0.11); limb(0,0.10,0,0.34,-1.28,0,0.11);             // legs
const collar=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,10),new THREE.MeshBasicMaterial({color:0x0A0A0A}));
collar.position.set(0,1.14,0.15); fig.add(collar);
F.s.add(fig);

/* ---- 8 · PRODUCT MOCKUP from primitives (no GLTF asset offline) ---- */
const Pm=mk('c8',34,6.4); const phone=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.7,3.4,0.16),new THREE.MeshBasicMaterial({color:0x141210}));
phone.add(body);
phone.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.7,3.4,0.16)),
  new THREE.LineBasicMaterial({color:GOLD})));
const screen=new THREE.Mesh(new THREE.PlaneGeometry(1.5,3.1),new THREE.MeshBasicMaterial({color:0x0A0A0A}));
screen.position.z=0.09; phone.add(screen);
for(let i=0;i<7;i++){                              // fake UI rows
  const w=0.4+Math.random()*0.9;
  const row=new THREE.Mesh(new THREE.PlaneGeometry(w,0.10),
    new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:i===0?1:0.35}));
  row.position.set(-0.75+w/2,1.2-i*0.34,0.10); phone.add(row);
}
phone.rotation.set(0.12,-0.55,0.04); Pm.s.add(phone);

/* ---- 9 · TYPE DISSOLVE: points sampled from TWO strings, mid-morph ---- */
const Dv=mk('c9',34,5.4);
function sample(txt){
  const c=document.createElement('canvas'); c.width=900; c.height=300;
  const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,900,300);
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  let fs=200; x.font='700 '+fs+'px DispBase, Georgia';
  while(x.measureText(txt).width>800&&fs>60){fs-=6;x.font='700 '+fs+'px DispBase, Georgia';}
  x.fillText(txt,450,158);
  const d=x.getImageData(0,0,900,300).data, out=[];
  for(let y=0;y<300;y+=4)for(let X=0;X<900;X+=4) if(d[(y*900+X)*4]>128) out.push([(X-450)/300,-(y-150)/300,0]);
  return out;
}
const A2=sample('21'), B2=sample('65');
const CNT=Math.max(A2.length,B2.length);
const dg=new THREE.BufferGeometry(); const dpos=new Float32Array(CNT*3);
dg.setAttribute('position',new THREE.BufferAttribute(dpos,3));
Dv.s.add(new THREE.Points(dg,new THREE.PointsMaterial({color:GOLD,size:0.030})));

/* ---- 10 · DEPTH OF FIELD via BokehPass ---- */
const Df=mk('c10',34,7);
for(let i=0;i<9;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.30,20,16),gMat);
  m.position.set((i%3-1)*1.5,(Math.floor(i/3)-1)*1.5,-i*0.9+2.5);
  Df.s.add(m);
}
const comp=new EffectComposer(Df.r);
comp.addPass(new RenderPass(Df.s,Df.c));
comp.addPass(new BokehPass(Df.s,Df.c,{focus:7.0,aperture:0.0026,maxblur:0.012}));

/* ---- 11 · CAMERA FLIGHT: word built as instanced boxes, camera inside ---- */
const Cf=mk('c11',60,0);
const wordPts=sample('AI');
const inst=new THREE.InstancedMesh(new THREE.BoxGeometry(0.028,0.028,0.9),gMat,wordPts.length*3);
{ const d=new THREE.Object3D(); let k=0;
  for(let layer=0;layer<3;layer++) for(const p of wordPts){
    d.position.set(p[0]*1.5,p[1]*1.5,-layer*2.2);
    d.updateMatrix(); inst.setMatrixAt(k++,d.matrix);
  }
  inst.count=k; inst.instanceMatrix.needsUpdate=true; }
Cf.s.add(inst); Cf.c.position.z=3.2;

/* ---- reference: current flat 2D figure ---- */
const Rf=mk('c12',34,7.2);
{ const c=document.createElement('canvas'); c.width=400; c.height=420;
  const x=c.getContext('2d'); x.strokeStyle='#E7C765'; x.lineWidth=7.2; x.lineCap='round';
  x.beginPath(); x.arc(200,120,46,0,Math.PI*2); x.stroke();
  x.lineWidth=6; x.beginPath(); x.moveTo(200,166); x.lineTo(200,268); x.stroke();
  x.beginPath(); x.moveTo(200,190); x.lineTo(140,225); x.lineTo(150,180); x.stroke();
  x.beginPath(); x.moveTo(200,190); x.lineTo(260,225); x.lineTo(250,180); x.stroke();
  x.beginPath(); x.moveTo(200,268); x.lineTo(165,350); x.stroke();
  x.beginPath(); x.moveTo(200,268); x.lineTo(238,348); x.stroke();
  x.fillStyle='#0A0A0A'; x.fillRect(172,112,56,12);
  const t=new THREE.CanvasTexture(c);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(4.2,4.4),
    new THREE.MeshBasicMaterial({map:t,transparent:true})); Rf.s.add(pl); }

window.seek=function(t){
  const e=eOut(t/1.2);
  fig.rotation.y=-0.42+Math.sin(t*0.5)*0.10; fig.rotation.x=0.06;
  phone.rotation.y=-0.55+t*0.16;
  const a=dg.attributes.position.array;
  const morph=0.5;                                  // frozen MID-morph so the effect is visible in a still
  for(let i=0;i<CNT;i++){
    const p1=A2[i%A2.length], p2=B2[i%B2.length];
    const jitter=Math.sin(i*12.9898)*0.5;
    const m=Math.min(1,Math.max(0,(morph-0.15)*2+jitter*0.35));
    a[i*3]=p1[0]+(p2[0]-p1[0])*m;
    a[i*3+1]=p1[1]+(p2[1]-p1[1])*m;
    a[i*3+2]=jitter*0.55*Math.sin(m*Math.PI);       // fragments bow out of plane mid-flight
  }
  dg.attributes.position.needsUpdate=true;
  Cf.c.position.z=3.2-t*1.1;
  F.r.render(F.s,F.c); Pm.r.render(Pm.s,Pm.c); Dv.r.render(Dv.s,Dv.c);
  comp.render(); Cf.r.render(Cf.s,Cf.c); Rf.r.render(Rf.s,Rf.c);
};
document.fonts.ready.then(()=>{ window.seek(1.2); document.title='ready'; });
</script></body></html>
