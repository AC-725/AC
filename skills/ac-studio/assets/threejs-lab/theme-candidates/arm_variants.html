<!DOCTYPE html><html><head><meta charset="UTF-8">
<script type="importmap">{"imports":{"three":"../three.module.min.js"}}</script>
<style>
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-400.ttf');font-weight:400}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-600.ttf');font-weight:600}
*{margin:0;box-sizing:border-box}
body{background:#0A0A0A;font-family:'Poppins',sans-serif;width:1400px;padding:40px}
h1{color:#E7C765;font-size:28px;font-weight:600}
.sub{color:#8f8574;font-size:16px;margin:6px 0 24px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tile{background:#0D0C0A;border:1px solid #2a2620;padding:10px}
.tile canvas{display:block;width:400px;height:360px}
.nm{color:#F2EDE4;font-size:19px;font-weight:600;margin:10px 0 2px}
.uc{color:#8f8574;font-size:14px}
</style></head><body>
<h1>2 · ROBOT ARM — three ways, pick one (or kill the icon)</h1>
<div class="sub">same automation slot, three silhouettes · all law-safe</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
const GOLD=0xE7C765;
const lm=o=>new THREE.LineBasicMaterial({color:GOLD,transparent:true,opacity:o});
const solid=c=>new THREE.MeshBasicMaterial({color:c});
const edges=(g,o)=>new THREE.LineSegments(new THREE.EdgesGeometry(g),lm(o));
const line=(pts,o)=>new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm(o));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const defs=[];
function tile(name,use,build){defs.push({name,use,build});}
function seg(g,ax,ay,bx,by,w,o){const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);
  const e=edges(new THREE.BoxGeometry(w,L,w),o); e.position.set((ax+bx)/2,(ay+by)/2,0);
  e.rotation.z=Math.atan2(dy,dx)-Math.PI/2; g.add(e); return e;}

// V1 — current draft (the one on the icon sheet)
tile('V1 · CURRENT','the sheet draft, unchanged',g=>{
  const base=edges(new THREE.CylinderGeometry(0.72,0.95,0.3,18),0.7); base.position.y=-1.15; g.add(base);
  const S=[0,-0.95],E=[0.45,0.15],W=[0.95,0.8];
  seg(g,S[0],S[1],E[0],E[1],0.44,0.8); seg(g,E[0],E[1],W[0],W[1],0.34,0.8);
  [[S,0.24],[E,0.2],[W,0.16]].forEach(([p,r2])=>{
    const j=new THREE.Mesh(new THREE.SphereGeometry(r2,16,12),solid(GOLD));
    j.position.set(p[0],p[1],0); g.add(j);});
  const d=Math.atan2(W[1]-E[1],W[0]-E[0]);
  [0.6,-0.6].forEach(off=>{
    const a1=d+off,a2=d+off*0.15;
    const p1=V(W[0]+Math.cos(a1)*0.45,W[1]+Math.sin(a1)*0.45,0);
    const p2=V(p1.x+Math.cos(a2)*0.42,p1.y+Math.sin(a2)*0.42,0);
    g.add(line([V(W[0],W[1],0),p1,p2],0.9));});
  g.position.set(-0.4,0,0); g.rotation.y=0.15; g.scale.setScalar(1.0);});

// V2 — industrial gripper: base plate, column, piston, parallel fingers on a task box
tile('V2 · GRIPPER','industrial two-finger arm over the boring task',g=>{
  const plate=edges(new THREE.BoxGeometry(1.9,0.16,1.0),0.6); plate.position.set(-0.45,-1.25,0); g.add(plate);
  seg(g,-0.85,-1.17,-0.85,-0.45,0.36,0.8);                       // column
  seg(g,-0.85,-0.45,0.05,0.35,0.3,0.8);                          // link 1
  seg(g,0.05,0.35,0.9,-0.05,0.26,0.8);                           // link 2, reaching down
  g.add(line([V(-0.45,-1.15,0),V(-0.28,-0.15,0)],0.45));         // piston rod
  g.add(line([V(-0.55,-1.15,0),V(-0.38,-0.18,0)],0.45));
  [[-0.85,-0.45,0.17],[0.05,0.35,0.15],[0.9,-0.05,0.12]].forEach(([x,y,r2])=>{
    const j=new THREE.Mesh(new THREE.SphereGeometry(r2,16,12),solid(GOLD));
    j.position.set(x,y,0); g.add(j);});
  // wrist bar + two parallel fingers
  seg(g,0.78,-0.16,1.16,-0.34,0.1,0.9);
  seg(g,0.82,-0.25,0.7,-0.72,0.09,0.9);
  seg(g,1.2,-0.42,1.08,-0.89,0.09,0.9);
  const box=edges(new THREE.BoxGeometry(0.5,0.42,0.45),0.75); box.position.set(0.9,-1.02,0); g.add(box);
  g.add(line([V(-1.6,-1.34,0),V(1.7,-1.34,0)],0.3));             // ground
  g.position.set(0,0.15,0); g.rotation.y=0.12;});

// V3 — gantry claw: crane claw descending on the package
tile('V3 · CLAW','the claw picks up the task, crane style',g=>{
  g.add(line([V(-1.6,1.25,0),V(1.6,1.25,0)],0.6));               // rail
  [[-1.35],[1.35]].forEach(([x])=>g.add(line([V(x,1.25,0),V(x,1.05,0)],0.6)));
  const tr=edges(new THREE.BoxGeometry(0.5,0.22,0.4),0.8); tr.position.set(0.15,1.12,0); g.add(tr);
  g.add(line([V(0.15,1.02,0),V(0.15,0.3,0)],0.8));               // cable
  const hub=new THREE.Mesh(new THREE.SphereGeometry(0.14,16,12),solid(GOLD)); hub.position.set(0.15,0.25,0); g.add(hub);
  // three claw fingers as bent polylines around the box
  [[-0.5,0],[0.5,0],[0,1]].forEach(([sx,back])=>{
    const zoff=back? -0.32:0;
    const x0=0.15, y0=0.25;
    const midx=x0+sx*0.55, midy=-0.2, tipx=x0+sx*0.34, tipy=-0.62;
    g.add(line([V(x0,y0,zoff),V(midx,midy,zoff),V(tipx,tipy,zoff)],back?0.45:0.9));});
  const box=edges(new THREE.BoxGeometry(0.72,0.6,0.6),0.75); box.position.set(0.15,-0.75,0); g.add(box);
  g.add(line([V(-0.21,-0.75,0.31),V(0.51,-0.75,0.31)],0.5));     // tape line on the box
  g.add(line([V(-1.5,-1.15,0),V(1.7,-1.15,0)],0.3));             // ground
  g.position.y=-0.05;});

const grid=document.getElementById('grid');
defs.forEach(({name,use,build})=>{
  const t=document.createElement('div'); t.className='tile';
  const cv=document.createElement('canvas'); cv.width=800; cv.height=720; t.appendChild(cv);
  const nm=document.createElement('div'); nm.className='nm'; nm.textContent=name; t.appendChild(nm);
  const uc=document.createElement('div'); uc.className='uc'; uc.textContent=use; t.appendChild(uc);
  grid.appendChild(t);
  try{
    const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
    r.setSize(800,720,false); r.setClearColor(0x0A0A0A,1);
    const s=new THREE.Scene(), c=new THREE.PerspectiveCamera(34,800/720,0.1,60);
    c.position.set(0,0,6.4);
    const g=new THREE.Group(); build(g); s.add(g);
    r.render(s,c);
  }catch(e){nm.textContent+=' ERR'; uc.textContent=String(e).slice(0,80);}
});
document.title='ready';
</script></body></html>
