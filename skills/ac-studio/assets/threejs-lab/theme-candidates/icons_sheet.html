<!DOCTYPE html><html><head><meta charset="UTF-8">
<script type="importmap">{"imports":{"three":"../three.module.min.js"}}</script>
<style>
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-400.ttf');font-weight:400}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-600.ttf');font-weight:600}
*{margin:0;box-sizing:border-box}
body{background:#0A0A0A;font-family:'Poppins',sans-serif;width:1660px;padding:40px}
h1{color:#E7C765;font-size:30px;font-weight:600;letter-spacing:.02em}
.sub{color:#8f8574;font-size:17px;margin:6px 0 26px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tile{background:#0D0C0A;border:1px solid #2a2620;padding:10px}
.tile canvas{display:block;width:360px;height:320px}
.nm{color:#F2EDE4;font-size:19px;font-weight:600;margin:10px 0 2px}
.uc{color:#8f8574;font-size:14px}
.err{color:#c05a4a!important}
</style></head><body>
<h1>3D STORY ICONS · MENU 1 DRAFTS</h1>
<div class="sub">flat-gold law: edges, lines, points, unlit flat fills only · each bakes to transparent PNG for decks, or mounts live in a reel scene</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
const GOLD=0xE7C765, DIMG=0x655838, INK=0x0A0A0A;
const lm=o=>new THREE.LineBasicMaterial({color:GOLD,transparent:true,opacity:o});
const dm=o=>new THREE.LineBasicMaterial({color:DIMG,transparent:true,opacity:o});
const solid=c=>new THREE.MeshBasicMaterial({color:c});
const edges=(g,o)=>new THREE.LineSegments(new THREE.EdgesGeometry(g),lm(o));
const line=(pts,o)=>new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm(o));
const loop=(pts,o)=>new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),lm(o));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function circle(r,n=48){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push(V(Math.cos(a)*r,Math.sin(a)*r,0));}return p;}
const defs=[];
function tile(num,name,use,build){defs.push({num,name,use,build});}

// 1 ENVELOPE
tile(1,'ENVELOPE','email stories, the recurring niche',g=>{
  g.add(edges(new THREE.BoxGeometry(2.6,1.7,0.16),0.8));
  g.add(line([V(-1.3,0.85,0.09),V(0,-0.12,0.16),V(1.3,0.85,0.09)],0.9));
  g.add(line([V(-1.3,-0.85,0.09),V(-0.34,-0.28,0.13)],0.4));
  g.add(line([V(1.3,-0.85,0.09),V(0.34,-0.28,0.13)],0.4));
  g.rotation.set(-0.12,0.38,0);});

// 2 HOURGLASS
tile(2,'HOURGLASS','time saved, every trial story',g=>{
  const cone=new THREE.ConeGeometry(0.95,1.3,12,1,true);
  const top=new THREE.Mesh(cone,new THREE.MeshBasicMaterial({color:GOLD,wireframe:true,transparent:true,opacity:0.4}));
  top.rotation.x=Math.PI; top.position.y=0.68; g.add(top);
  const bot=new THREE.Mesh(cone.clone(),top.material.clone()); bot.position.y=-0.68; g.add(bot);
  const hrim=circle(0.95);
  [1.33,-1.33].forEach(y=>{const l=loop(hrim,0.85); l.rotation.x=Math.PI/2; l.position.y=y; g.add(l);});
  const sand=[];
  for(let i=0;i<70;i++){const t=Math.random(),y=-1.28+t*0.5,r=(0.28+(1-t)*0.5)*Math.random();
    const a=Math.random()*Math.PI*2; sand.push(Math.cos(a)*r,y,Math.sin(a)*r);}
  for(let i=0;i<8;i++) sand.push((Math.random()-0.5)*0.05,-0.55+i*0.15,(Math.random()-0.5)*0.05);
  g.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position',
    new THREE.Float32BufferAttribute(sand,3)),
    new THREE.PointsMaterial({color:GOLD,size:0.05})));
  g.rotation.y=0.5; g.scale.setScalar(0.92);});

// 3 BRAIN
tile(3,'BRAIN','AI-itself stories',g=>{
  const pts=[],N=240;
  for(let i=0;i<N;i++){const y=1-2*i/(N-1),r=Math.sqrt(1-y*y),a=i*2.39996;
    let x=Math.cos(a)*r*1.0, z=Math.sin(a)*r*0.8, yy=y*0.92;
    x+=(x<0?-0.24:0.24); pts.push(V(x,yy,z));}
  const flat=[]; pts.forEach(p=>flat.push(p.x,p.y,p.z));
  g.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position',
    new THREE.Float32BufferAttribute(flat,3)),
    new THREE.PointsMaterial({color:GOLD,size:0.05,transparent:true,opacity:0.95})));
  const lp=[];
  pts.forEach((a,i)=>pts.forEach((b,j)=>{if(j>i&&a.distanceTo(b)<0.34&&(a.x<0)==(b.x<0))lp.push(a,b);}));
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lp),lm(0.2)));
  g.rotation.set(0.10,0.15,0); g.scale.setScalar(1.02);});

// 4 CHAT BUBBLES
tile(4,'CHAT BUBBLES','chatbot and support stories',g=>{
  function bubble(w,h,z,ox,oy,o){
    const r=0.24,s=new THREE.Shape();
    s.moveTo(-w/2+r,-h/2); s.lineTo(w/2-r,-h/2); s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
    s.lineTo(w/2,h/2-r); s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
    s.lineTo(-w/2+r,h/2); s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
    s.lineTo(-w/2,-h/2+r); s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(s,10)),lm(o));
    e.position.set(ox,oy,z); g.add(e);
    g.add(line([V(ox+w*0.18,oy-h/2,z),V(ox+w*0.30,oy-h/2-0.32,z),V(ox+w*0.42,oy-h/2,z)],o));
    const dp=[]; [-0.35,0,0.35].forEach(dx=>dp.push(ox+dx,oy,z));
    g.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(dp,3)),
      new THREE.PointsMaterial({color:GOLD,size:0.09,transparent:true,opacity:o})));}
  bubble(2.0,1.15,0,-0.25,-0.6,0.9);
  bubble(1.6,0.95,-0.9,0.75,0.55,0.5);
  bubble(1.4,0.85,-1.8,-0.8,1.35,0.28);
  g.rotation.y=-0.18; g.position.y=-0.3; g.scale.setScalar(0.9);});

// 5 DOCUMENT STACK
tile(5,'DOCUMENT STACK','paperwork automation',g=>{
  for(let i=0;i<4;i++){
    const e=edges(new THREE.BoxGeometry(2.0,2.7,0.05),i==0?0.85:0.38-i*0.05);
    e.position.set(i*0.07,i*0.05,-i*0.2); e.rotation.y=i*0.02; g.add(e);}
  [[0.95,0.75],[0.6,0.75],[0.25,0.75],[-0.1,0.45]].forEach(([y,w])=>
    g.add(line([V(-0.75,y,0.03),V(-0.75+w*1.6,y,0.03)],0.55)));
  g.add(line([V(-0.75,-0.95,0.03),V(0.15,-0.95,0.03)],0.95));
  g.rotation.y=0.3; g.position.x=-0.15;});

// 6 SHIELD
tile(6,'SHIELD','security and scam stories',g=>{
  const s=new THREE.Shape();
  s.moveTo(0,1.25); s.lineTo(1.0,0.9); s.quadraticCurveTo(1.08,-0.35,0,-1.3);
  s.quadraticCurveTo(-1.08,-0.35,-1.0,0.9); s.closePath();
  g.add(edges(new THREE.ExtrudeGeometry(s,{depth:0.28,bevelEnabled:false}),0.75));
  g.add(line([V(-0.38,0.05,0.30),V(-0.1,-0.32,0.30),V(0.48,0.5,0.30)],0.95));
  g.rotation.set(0.05,0.4,0);});

// 7 COIN STACK — solid ink cores occlude back rims
tile(7,'COIN STACK','money and pricing stories',g=>{
  const crim=circle(0.95);
  for(let i=0;i<4;i++){
    const cx=(i%2?0.12:-0.1), cy=-0.7+i*0.38, cz=(i%2?-0.05:0.05), o=i==3?0.9:0.5;
    const core=new THREE.Mesh(new THREE.CylinderGeometry(0.945,0.945,0.16,30),solid(INK));
    core.position.set(cx,cy,cz); g.add(core);
    [cy-0.085,cy+0.085].forEach(y=>{const l=loop(crim,o);
      l.rotation.x=Math.PI/2; l.position.set(cx,y,cz); g.add(l);});
    for(let k=0;k<3;k++){const a=k*Math.PI*2/3+0.5;
      g.add(line([V(cx+Math.cos(a)*0.95,cy-0.085,cz+Math.sin(a)*0.95),
                  V(cx+Math.cos(a)*0.95,cy+0.085,cz+Math.sin(a)*0.95)],o*0.7));}}
  const inner=loop(circle(0.6),0.75); inner.rotation.x=Math.PI/2;
  inner.position.set(0.12,-0.7+3*0.38+0.09,-0.05); g.add(inner);
  g.rotation.set(0.5,0.15,0); g.position.y=0.2; g.scale.setScalar(0.95);});

// 8 ROCKET
tile(8,'ROCKET','launch stories',g=>{
  [-0.75,0.1,0.75].forEach(y=>{const l=loop(circle(0.42),y==0.75?0.8:0.5);
    l.rotation.x=Math.PI/2; l.position.y=y; g.add(l);});
  g.add(line([V(-0.42,-0.75,0),V(-0.42,0.75,0)],0.8));
  g.add(line([V(0.42,-0.75,0),V(0.42,0.75,0)],0.8));
  g.add(line([V(-0.42,0.75,0),V(0,1.55,0)],0.9));
  g.add(line([V(0.42,0.75,0),V(0,1.55,0)],0.9));
  const finShape=new THREE.Shape(); finShape.moveTo(0,0); finShape.lineTo(0.5,-0.55); finShape.lineTo(0,-0.8); finShape.closePath();
  [[-0.42,1],[0.42,-1]].forEach(([x,sx])=>{
    const f=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.ShapeGeometry(finShape)),lm(0.7));
    f.position.set(x,-0.35,0); f.scale.x=sx*-1; g.add(f);});
  const win=loop(circle(0.16),0.9); win.position.set(0,0.32,0.02); g.add(win);
  const ex=[]; for(let i=0;i<22;i++){const t=Math.random();
    ex.push((Math.random()-0.5)*0.5*t,-0.95-t*0.75,(Math.random()-0.5)*0.5*t);}
  g.add(new THREE.Points(new THREE.BufferGeometry().setAttribute('position',
    new THREE.Float32BufferAttribute(ex,3)),
    new THREE.PointsMaterial({color:GOLD,size:0.05,transparent:true,opacity:0.8})));
  g.rotation.set(0.0,0.0,0.09); g.scale.setScalar(0.82); g.position.y=0.1;});

// 9 ROBOT ARM — computed chain
tile(9,'ROBOT ARM','automation stories',g=>{
  const base=edges(new THREE.CylinderGeometry(0.72,0.95,0.3,18),0.7); base.position.y=-1.15; g.add(base);
  function seg(ax,ay,bx,by,w,o){const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);
    const e=edges(new THREE.BoxGeometry(w,L,w),o); e.position.set((ax+bx)/2,(ay+by)/2,0);
    e.rotation.z=Math.atan2(dy,dx)-Math.PI/2; g.add(e);}
  const S=[0,-0.95], E=[0.45,0.15], W=[0.95,0.8];
  seg(S[0],S[1],E[0],E[1],0.44,0.8); seg(E[0],E[1],W[0],W[1],0.34,0.8);
  [[S,0.24],[E,0.2],[W,0.16]].forEach(([p,r2])=>{
    const j=new THREE.Mesh(new THREE.SphereGeometry(r2,16,12),solid(GOLD));
    j.position.set(p[0],p[1],0); g.add(j);});
  const d=Math.atan2(W[1]-E[1],W[0]-E[0]);
  [0.6,-0.6].forEach(off=>{
    const a1=d+off, a2=d+off*0.15;
    const p1=V(W[0]+Math.cos(a1)*0.45,W[1]+Math.sin(a1)*0.45,0);
    const p2=V(p1.x+Math.cos(a2)*0.42,p1.y+Math.sin(a2)*0.42,0);
    g.add(line([V(W[0],W[1],0),p1,p2],0.9));});
  g.position.set(-0.4,0.0,0); g.rotation.y=0.15; g.scale.setScalar(1.05);});

// 10 GLOBE + ROUTES
tile(10,'GLOBE + ROUTES','worldwide rollouts',g=>{
  const R=1.18;
  [-60,-30,0,30,60].forEach(deg=>{
    const ph=deg*Math.PI/180, l=loop(circle(R*Math.cos(ph)),deg==0?0.5:0.3);
    l.rotation.x=Math.PI/2; l.position.y=R*Math.sin(ph); g.add(l);});
  for(let i=0;i<6;i++){const l=loop(circle(R),0.3); l.rotation.y=i*Math.PI/6; g.add(l);}
  function surf(lat,lon){const p=lat*Math.PI/180,q=lon*Math.PI/180;
    return V(R*Math.cos(p)*Math.cos(q),R*Math.sin(p),R*Math.cos(p)*Math.sin(q));}
  [[22,114,40,-74],[22,114,51,0],[22,114,-33,151]].forEach(([a,b,cc,dd])=>{
    const A=surf(a,b),B=surf(cc,dd),M=A.clone().add(B).multiplyScalar(0.5).normalize().multiplyScalar(R*1.5);
    const cur=new THREE.QuadraticBezierCurve3(A,M,B);
    g.add(line(cur.getPoints(40),0.95));
    [A,B].forEach(p=>{const d2=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8),solid(GOLD)); d2.position.copy(p); g.add(d2);});});
  g.rotation.set(0.18,0.65,0);});

// 11 HK JUNK
tile(11,'HK JUNK BOAT','the Hong Kong signature',g=>{
  g.add(line([V(-1.5,-0.5,0),V(-1.25,-0.85,0),V(1.15,-0.85,0),V(1.62,-0.35,0)],0.9));
  g.add(line([V(-1.5,-0.5,0),V(-1.05,-0.55,0),V(1.35,-0.55,0),V(1.62,-0.35,0)],0.5));
  g.add(line([V(0.12,-0.55,0),V(0.12,1.35,0)],0.7));
  const luff=[0.05,0.38,0.71,1.04,1.32], leech=[[1.15,0.05],[1.18,0.42],[1.08,0.78],[0.9,1.08],[0.62,1.3]];
  luff.forEach((y,i)=>g.add(line([V(0.12,y,0.02),V(leech[i][0],leech[i][1],0.02)],0.75)));
  g.add(line(leech.map(p=>V(p[0],p[1],0.02)),0.75));
  g.add(line([V(-0.78,-0.55,0),V(-0.78,0.85,0)],0.6));
  const l2=[-0.05,0.25,0.55,0.8], le2=[[-0.15,-0.02],[-0.13,0.28],[-0.22,0.55],[-0.38,0.76]];
  l2.forEach((y,i)=>g.add(line([V(-0.78,y,-0.02),V(le2[i][0],y+0.03,-0.02)],0.55)));
  g.add(line(le2.map(p=>V(p[0],p[1],-0.02)),0.55));
  g.add(line([V(-1.7,-1.05,0),V(-1.15,-1.05,0)],0.3));
  g.add(line([V(0.5,-1.08,0),V(1.25,-1.08,0)],0.3));
  g.rotation.y=-0.15; g.position.y=-0.1;});

// 12 DATA CHART
tile(12,'DATA CHART','real numbers with depth',g=>{
  for(let i=0;i<=4;i++){g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [V(-1.6,-1.05,-0.8+i*0.4),V(1.6,-1.05,-0.8+i*0.4)]),dm(0.5)));}
  for(let i=0;i<=4;i++){g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [V(-1.6+i*0.8,-1.05,-0.8),V(-1.6+i*0.8,-1.05,0.8)]),dm(0.5)));}
  const hs=[0.5,0.85,1.3,2.0];
  hs.forEach((h,i)=>{
    const hot=i==3;
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.42,h,0.42),solid(hot?GOLD:0x3a3226));
    m.position.set(-1.2+i*0.8,-1.05+h/2,0); g.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
      new THREE.LineBasicMaterial({color:hot?INK:GOLD,transparent:true,opacity:hot?0.9:0.5})));});
  g.rotation.set(0.32,0.5,0); g.position.y=0.25; g.scale.setScalar(0.9);});

// build all tiles
const grid=document.getElementById('grid');
defs.forEach(({num,name,use,build})=>{
  const t=document.createElement('div'); t.className='tile';
  const cv=document.createElement('canvas'); cv.width=720; cv.height=640; t.appendChild(cv);
  const nm=document.createElement('div'); nm.className='nm'; nm.textContent=num+' · '+name; t.appendChild(nm);
  const uc=document.createElement('div'); uc.className='uc'; uc.textContent=use; t.appendChild(uc);
  grid.appendChild(t);
  try{
    const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
    r.setSize(720,640,false); r.setClearColor(0x0A0A0A,1);
    const s=new THREE.Scene(), c=new THREE.PerspectiveCamera(34,720/640,0.1,60);
    c.position.set(0,0,6.4);
    const g=new THREE.Group(); build(g); s.add(g);
    r.render(s,c);
  }catch(e){nm.classList.add('err'); nm.textContent+=' ERR'; uc.textContent=String(e).slice(0,80);}
});
document.title='ready';
</script></body></html>
