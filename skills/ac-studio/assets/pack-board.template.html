<!DOCTYPE html><html><head><meta charset="utf-8">
<!--
  AC — STUDIO · THE PACK BOARD  (Stop 1a — the imagery pack, approved before it mounts)
  ============================================================================
  Renders pack.json into the approval board AC reads: every object at 600px,
  at its TRUE mount size on its ACTUAL ground, and at 140px feed size; the
  three colour families as swatches; the red exception, if declared, with
  its element and reason. A board that shows icons at a convenient size is
  a mood sheet, not a gate.

  Do not edit this file per run. The data comes from pack.json, injected by
  scripts/render_pack_board.js as window.PACK; icons resolve relative to
  the manifest (pack/icons/<key>.png).
  ============================================================================
-->
<style>
@font-face{font-family:'Gloock';src:url('fonts/Gloock-Regular.ttf')}
@font-face{font-family:'Poppins';src:url('fonts/Poppins-400.ttf');font-weight:400}
@font-face{font-family:'Poppins';src:url('fonts/Poppins-600.ttf');font-weight:600}
:root{--ground:#0A0A0A;--gold:#E7C765;--gold-dim:#796938;--cream:#F4F0E7;--stone:#B9B1A1;--dim:#8A8371;--card:#111009;--hair:rgba(201,169,97,.18);--red:#E5484D}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;background:var(--ground);color:var(--stone);font-family:'Poppins',sans-serif;padding:56px 64px 64px}
.k{font-weight:600;font-size:15px;letter-spacing:5px;text-transform:uppercase;color:var(--gold)}
.k .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:14px;vertical-align:1px}
#hdr{display:flex;justify-content:space-between;align-items:baseline}
#hdr .h{font-weight:600;font-size:15px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-dim)}
h1{font-family:'Gloock';font-weight:400;font-size:74px;line-height:1.05;color:var(--cream);margin:34px 0 14px;letter-spacing:-.5px}
#sub{font-size:22px;line-height:1.5;color:var(--stone);max-width:1180px}
#sub b{color:var(--cream);font-weight:600}
.sec{margin-top:52px;display:flex;align-items:center;gap:22px}
.sec:after{content:'';flex:1;height:1px;background:var(--hair)}
#meta{display:flex;gap:44px;margin-top:26px;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
#meta b{color:var(--cream);font-weight:600}
#swatches{display:flex;gap:26px;margin-top:26px}
.sw{display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--stone)}
.sw i{display:block;width:54px;height:54px;border:1px solid var(--hair)}
.sw small{display:block;font-size:12px;letter-spacing:2px;color:var(--dim);margin-top:4px}
#redrow{margin-top:18px;font-size:16px;color:var(--stone);line-height:1.5}
#redrow b{color:var(--red);font-weight:600;letter-spacing:2px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:30px}
.tile{background:var(--card);border:1px solid var(--hair);padding:28px 28px 24px}
.tile.hero{grid-column:span 2}
.tile .slot{font-weight:600;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
.tile .role{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-top:6px}
.row{display:flex;align-items:flex-end;gap:26px;margin-top:22px}
.big{flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--ground);border:1px solid var(--hair)}
.big img{display:block}
.side{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.mnt{display:flex;align-items:center;justify-content:center;border:1px solid var(--hair);background:var(--ground)}
.mnt.gold{background:linear-gradient(172deg,#EFD588 0%,#E7C76F 52%,#C9A14E 100%)}
.mnt img{display:block}
.lab{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim)}
.name{font-family:'Gloock';font-size:34px;color:var(--cream);margin-top:22px}
.concept{font-size:17px;line-height:1.5;color:var(--stone);margin-top:6px;max-width:440px}
.src{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-dim);margin-top:12px}
#none{margin-top:26px;font-size:16px;color:var(--dim)}
#none b{color:var(--stone);font-weight:600}
#foot{display:flex;justify-content:space-between;margin-top:50px;padding-top:24px;border-top:1px solid var(--hair);font-size:16px;color:var(--dim)}
#foot b{color:var(--gold);font-weight:600}
</style></head><body>
<div id="hdr"><div class="k"><span class="dot"></span><span id="stoplabel">Pack board · Stop 1a</span></div><div class="h" id="handle">@ITSAC.AI</div></div>
<h1 id="title">Pack</h1>
<div id="sub"></div>
<div id="meta"></div>
<div class="sec k">Colours · the three families</div>
<div id="swatches"></div>
<div id="redrow"></div>
<div class="sec k">Every object · 600 · true mount on its ground · 140 feed</div>
<div id="grid"></div>
<div id="none"></div>
<div id="foot"><div id="footline">Stop 1a. <b>Nothing mounts until this passes.</b> Approve, or strike an object in one line.</div><div id="count"></div></div>
<script>
(function(){
  const P = window.PACK; if(!P){ document.getElementById('title').textContent='no PACK injected'; return; }
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const stop0 = String(P.stop || '') === '0';
  $('stoplabel').textContent = stop0 ? 'Hero preview · Stop 0' : 'Pack board · Stop 1a';
  $('title').textContent = P.pack;
  $('sub').innerHTML = esc(P.topic) + (P.brief ? '<br>' + esc(P.brief) : '') +
    '<br>Every object below is <b>one family</b> — one camera, one light, one material, one scale system. Shown at true size; nothing is mounted until this board passes.';
  const bakes = P.objects.filter(o => o.source === 'bake' || o.source === 'trace').length;
  $('meta').innerHTML = `<div>Format <b>${esc(P.format)}</b></div><div>Dimension <b>${esc(P.dimension)}</b></div><div>Look <b>${esc(P.look)}</b></div><div>Objects <b>${P.objects.length}</b></div><div>New bakes <b>${bakes}</b></div>`;
  const FAM = { black:['#0A0A0A','the ground and its inks'], gold:['#E7C765','light to dim, one family'], cream:['#F4F0E7','warm white, stone, dim'] };
  $('swatches').innerHTML = (P.colours.families||[]).map(f => `<div class="sw"><i style="background:${FAM[f]?FAM[f][0]:'#f0f'}"></i><div>${esc(f)}<small>${FAM[f]?FAM[f][1]:'?'}</small></div></div>`).join('') +
    (P.colours.red && P.colours.red.on ? `<div class="sw"><i style="background:#E5484D"></i><div>red<small>the exception · one element</small></div></div>` : '') +
    (P.colours.team && P.colours.team.on ? (P.colours.team.hexes||[]).map(h => `<div class="sw"><i style="background:${esc(h)}"></i><div>team<small>${esc(P.colours.team.subject)} only</small></div></div>`).join('') : '');
  const lines = [];
  if (P.colours.red && P.colours.red.on) lines.push(`<b>RED, DECLARED</b> · on <b>${esc(P.colours.red.element)}</b> only · because ${esc(P.colours.red.reason)}`);
  if (P.colours.team && P.colours.team.on) lines.push(`<b style="color:var(--gold)">TEAM COLOURS, DECLARED</b> · on <b>${esc(P.colours.team.subject)}</b> (stage only) · because ${esc(P.colours.team.reason)}`);
  $('redrow').innerHTML = lines.length ? lines.join('<br>') : 'No red, no team colours on this post. Three families, gold means look here.';
  const grid = $('grid');
  P.objects.forEach(o => {
    const m = +o.mount || 208; const ground = (o.ground === 'gold') ? 'gold' : 'black';
    const t = document.createElement('div'); t.className = 'tile' + (o.role === 'hero' ? ' hero' : '');
    const big = o.role === 'hero' ? 600 : 420;
    t.innerHTML = `<div class="slot">${esc(o.slot)}</div><div class="role">${esc(o.role)} · ${m}px · on ${ground}</div>
      <div class="row">
        <div class="big" style="width:${big}px;height:${big}px"><img src="${esc(o.file)}" style="width:${big}px;height:${big}px"></div>
        <div class="side">
          <div class="mnt ${ground}" style="width:${Math.max(m,72)+40}px;height:${Math.max(m,72)+40}px"><img src="${esc(o.file)}" style="width:${m}px;height:${m}px"></div><div class="lab">true mount · ${m}px</div>
          <div class="mnt ${ground}" style="width:180px;height:180px"><img src="${esc(o.file)}" style="width:140px;height:140px"></div><div class="lab">feed · 140px</div>
        </div>
      </div>
      <div class="name">${esc(o.key)}</div><div class="concept">${esc(o.concept||'')}</div><div class="src">${esc(o.source||'bake')}</div>`;
    grid.appendChild(t);
  });
  const none = (P.no_anchor||[]);
  $('none').innerHTML = none.length ? `Slots with <b>no object by design</b>: ${none.map(esc).join(' · ')} — the copy owns those frames.` : '';
  $('count').textContent = `${P.objects.length} objects · ${bakes} baked this run · ${P.slots.length} slots`;
  $('handle').textContent = (P.handle || '@ITSAC.AI').toUpperCase();
  if (stop0) $('footline').innerHTML = 'Stop 0. <b>The pick\'s hero, baked in the recommended look.</b> Choose a direction; nothing else is baked until you do.';
  document.body.dataset.ready = '1';
})();
</script></body></html>
