<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  AC — REEL CREATOR · black-and-gold animated reel engine (deterministic seek(t))
  ============================================================================
  FRONT-LOADED reel. Sub-12s. Payoff-first, loud open (no fade from black),
  one visual "moment" per scene, loop callback, a FLAT black ground with no
  background effects of any kind, and a progress bar whose position is the
  theme's signature. Synced sound.
  TO MAKE A NEW VIDEO edit only: (1) the CONTENT object and (2) the THEME
  constant, both near the bottom. Do NOT change the SCENES timings unless you
  also update the cue times in reel_audio.py, or the sound desyncs.
  ============================================================================
-->
<style>
/* ===== DISPLAY FACES — one per theme. Files live in canvas-fonts; if you move this
   template, copy the .ttf files next to it and update these paths. ===== */
@font-face{font-family:'DispBase';src:url('fonts/Gloock-Regular.ttf');}
@font-face{font-family:'DispCrest';src:url('fonts/BricolageGrotesque-Bold.ttf');}
@font-face{font-family:'DispColumn';src:url('fonts/Italiana-Regular.ttf');}
@font-face{font-family:'DispMargin';src:url('fonts/InstrumentSerif-Italic.ttf');}
  :root{
    --black:#0A0A0A; --gold:#E7C765; --gold-deep:#C9A23F; --gold-light:#F4DF95;
    --white:#F4F0E7; --stone:#B9B1A1; --grey:#6f6a60;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0A;}
  /* FLAT GROUND. One value, no gradient, no glow, no grain, no mark. If you are
     tempted to add anything behind the type, don't. */
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A0A0A;--disp:'Lora';}
  #frame{position:absolute;inset:46px;border:1.5px solid rgba(231,199,101,0.34);}
  #frame2{display:none;position:absolute;inset:46px;border:1.5px solid rgba(10,10,10,0.38);}
  .tick{position:absolute;width:44px;height:44px;opacity:0;}
  .tick.tl{top:34px;left:34px;border-top:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.tr{top:34px;right:34px;border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  .tick.bl{bottom:34px;left:34px;border-bottom:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.br{bottom:34px;right:34px;border-bottom:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  #wm{position:absolute;bottom:645px;left:0;width:100%;text-align:center;
    font-family:'Poppins';font-weight:500;letter-spacing:6px;font-size:24px;color:rgba(231,199,101,0.5);}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:150px 110px 230px;text-align:center;visibility:hidden;}
  .el{opacity:0;will-change:transform,opacity;}

  .kicker{font-family:'Poppins';font-weight:600;font-size:29px;letter-spacing:7px;color:var(--gold);text-transform:uppercase;}
  .kicker .dot{color:rgba(231,199,101,0.5);margin:0 10px;}
  .livedot{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--gold);
    margin-right:16px;vertical-align:middle;box-shadow:0 0 14px var(--gold);}
  .h1{font-family:var(--disp),'Lora';font-weight:600;font-size:82px;line-height:1.26;color:var(--white);letter-spacing:-0.5px;}
  .h1.sm{font-size:70px;line-height:1.34;}
  .gold{background:linear-gradient(118deg,#F4DF95 0%,#E7C765 46%,#C9A23F 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(231,199,101,0.16));}
  .sub{font-family:'Poppins';font-weight:400;font-size:37px;line-height:1.4;color:var(--stone);max-width:820px;}
  .sub b{color:var(--white);font-weight:600;}

  .odometer{font-family:var(--disp),'Lora';font-weight:700;font-size:150px;line-height:1;letter-spacing:-3px;
    margin:10px 0 14px;}

  /* B — build/use toggle */
  .toggle{display:flex;align-items:center;gap:34px;}
  .chip{font-family:'Poppins';font-weight:700;font-size:46px;letter-spacing:3px;padding:16px 42px;border-radius:14px;
    text-transform:uppercase;position:relative;}
  .chip.build{color:var(--stone);border:2.5px solid rgba(185,177,161,0.5);}
  .chip.use{color:#0A0A0A;background:linear-gradient(118deg,#F4DF95,#C9A23F);border:2.5px solid var(--gold);
    box-shadow:0 0 44px rgba(231,199,101,0.28);}
  .arrow{font-family:'Poppins';font-weight:700;font-size:52px;color:var(--gold);}
  .strike{position:absolute;left:22px;right:22px;top:calc(50% - 3px);height:6px;border-radius:4px;
    background:linear-gradient(90deg,#F4DF95,#C9A23F);transform-origin:left center;transform:scaleX(0);}

  /* C — news stamp chip */
  .newschip{margin-top:30px;font-family:'Poppins';font-weight:600;font-size:31px;letter-spacing:1px;color:var(--gold);
    border:2px solid var(--gold);border-radius:12px;padding:13px 28px;box-shadow:0 0 30px rgba(231,199,101,0.16);}

  /* E — CTA */
  .mono{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp),'Lora';font-weight:600;font-size:74px;color:var(--gold);}
  .mono svg{position:absolute;inset:0;}
  .handle{font-family:var(--disp),'Lora';font-weight:600;font-size:80px;margin-bottom:10px;}
  /* transform-origin is BOTTOM CENTRE so the scene-E step-forward grows him up
     from his own feet instead of ballooning from the middle. Set here, never
     animated by CSS — figTick(t) writes the transform on every seek. */
  .acfig{position:absolute;left:104px;top:288px;width:150px;z-index:7;
         transform-origin:50% 100%;will-change:transform;}
  /* the subtitle is his speech: it shifts right of him and left-aligns */
  #stage.hasfig #subline{text-align:left;padding:0 110px 0 274px;}
  /* column drops its caption to the lower black half; he follows it down */
  #stage.t-column.hasfig .acfig{top:auto;bottom:180px;}
  /* NO CSS TRANSITION on the caret. It is driven by seek(t) and must resolve
     instantly: a transition makes rendering time-dependent, which breaks frame
     determinism AND makes the ink gate see phantom ink on every element
     (measured 2026-08-13 — it reported 10 false overlaps in scene A). */
  .acfig .fst{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:7.2;stroke-linecap:round;stroke-linejoin:round;}
  .acfig .fth{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round;}
  /* hair crown sits between the two weights: heavy enough to read as a mass at
     140px, light enough that it does not compete with the head rim at 7.2 */
  .acfig .fhr{fill:none;stroke:var(--figstroke,var(--gold));stroke-width:6;stroke-linecap:round;stroke-linejoin:round;}
  .acfig .fsun{fill:var(--figstroke,var(--gold));}
  .acfig .fcar{fill:var(--gold-light,#F4DF95);}
  #stage.light{--figstroke:#12100A;}
  .loopcur{font-family:'Poppins';font-weight:500;font-size:32px;letter-spacing:3px;color:rgba(231,199,101,0.62);}

  #stage.t-crest .h1{font-size:96px;letter-spacing:0.5px;}
  #stage.t-crest .h1.sm{font-size:84px;}
  #stage.t-crest .odometer{font-size:172px;letter-spacing:-1px;}
  #stage.t-column .h1{font-size:74px;letter-spacing:2px;line-height:1.24;}
  #stage.t-column .h1.sm{font-size:64px;}
  #stage.t-column .odometer{font-size:158px;letter-spacing:0px;}
  #stage.t-margin .h1{font-size:90px;}
  #stage.t-margin .h1.sm{font-size:78px;}
  #stage.t-margin .odometer{font-size:164px;letter-spacing:-2px;}

  /* ===== PROGRESS BAR — position is the theme's signature ===== */
  #progress{position:absolute;border-radius:3px;background:rgba(231,199,101,0.13);
    z-index:3;pointer-events:none;overflow:hidden;}
  #progress i{display:block;width:0;height:0;border-radius:3px;
    box-shadow:0 0 14px rgba(231,199,101,0.4);}

/* ==================================================================
   THE FOUR THEMES — structure, not light. One rule generates all four:
   THE CORNER TICKS MARK THE EDGE THE BAR RUNS ALONG.
   Type composition shifts to balance whichever edge is loaded.
   ================================================================== */

  /* I · BASE — bar along the bottom, type optically centred. The default. */
  /* ==================================================================
     THE FOUR THEMES · v5
     Each one must be nameable from a thumbnail. The progress indicator IS
     the theme's block: where it sits and how much mass it carries is the
     identity. Hierarchy, type case and colour balance all move with it.
     ================================================================== */
  #stage.t-base  {--disp:'DispBase';  background:linear-gradient(0deg,#131313 0%,#0A0A0A 58%);}
  #stage.t-crest {--disp:'DispCrest'; background:linear-gradient(180deg,#131313 0%,#0A0A0A 58%);}
  #stage.t-margin{--disp:'DispMargin';background:linear-gradient(270deg,#141414 0%,#0A0A0A 58%);}
  #stage.t-column{--disp:'DispColumn';
    background:linear-gradient(180deg,#EFD68A 0%,#E3C061 36%,#D3AC49 50%,#0F0F0F 50%,#0A0A0A 100%);}

  /* ===== PROGRESS INDICATOR — full bleed, and it is the block ===== */
  #progress{position:absolute;border-radius:0;z-index:3;pointer-events:none;overflow:hidden;
    background:rgba(231,199,101,0.09);}
  #progress i{display:block;width:0;height:0;border-radius:0;}

/* ---------------------------------------------------------------- I · BASE
   The number is the hero. Gold dominant. A heavy gold bar seals the floor. */
  /* base's bar sealed the FILE's floor, which the Instagram player covers: the bottom
     ~620px is chrome, so the block that IS this theme's identity was invisible in the
     app on every base post ever shipped. Logged since Day 24, declined twice as optional,
     fixed 2026-08-17 because it had blocked base out of the News rotation entirely and
     left only two usable themes. It now seals the floor of the VISIBLE frame instead. */
  #stage.t-base #progress{left:0;right:0;bottom:620px;height:26px;background:rgba(231,199,101,0.16);}
  /* the bar now occupies y1274-1300, which is where the watermark used to sit, so the
     watermark lifts clear for this theme only. */
  #stage.t-base #wm{bottom:700px;}
  #stage.t-base #progress i{height:100%;background:linear-gradient(90deg,#F4DF95,#C9A23F);}
  #stage.t-base .tick.bl,#stage.t-base .tick.br{opacity:1;}
  #stage.t-base .scene{justify-content:center;padding:150px 110px 260px;}
  #stage.t-base .h1{font-size:54px;}
  #stage.t-base .h1.sm{font-size:50px;}
  /* hero figure — keep it to 5 characters or fewer ($725B, 66%, 280x) */
  #stage.t-base .odometer{font-size:276px;letter-spacing:-9px;}
  #stage.t-base .sub{font-size:33px;}

/* --------------------------------------------------------------- II · CREST
   The headline is the hero, set in caps. White dominant. A gold band grows
   across the ceiling; that band is the progress indicator. */
  #stage.t-crest #progress{left:0;right:0;top:0;height:82px;background:rgba(231,199,101,0.17);}
  #stage.t-crest #progress i{height:100%;background:linear-gradient(90deg,#EFD68A,#D3AC49);}
  #stage.t-crest #frame{top:118px;}
  #stage.t-crest .tick.tl{top:106px;}#stage.t-crest .tick.tr{top:106px;}
  #stage.t-crest .tick.tl,#stage.t-crest .tick.tr{opacity:1;}
  #stage.t-crest .scene{justify-content:center;padding:400px 110px 460px;}
  /* caps are wide: 106px keeps a 16-char line clear of the frame */
  #stage.t-crest .h1{font-size:88px;line-height:1.20;text-transform:uppercase;letter-spacing:-1px;}
  #stage.t-crest .h1.sm{font-size:80px;line-height:1.26;}
  #stage.t-crest .h1.gold{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#F4F0E7;color:#F4F0E7;filter:none;}
  #stage.t-crest .odometer{font-size:112px;letter-spacing:-2px;}
  #stage.t-crest .sub{font-size:32px;}

/* -------------------------------------------------------------- III · COLUMN
   The frame splits. Gold owns the ceiling, black the floor, and black becomes
   the accent above the fold. The bar runs the full left edge, two-tone. */
  #stage.t-column #frame{clip-path:inset(50% 0 0 0);}
  #stage.t-column #frame2{display:block;clip-path:inset(0 0 50% 0);}
  #stage.t-column #progress{left:0;top:0;bottom:0;width:14px;
    background:linear-gradient(180deg,rgba(10,10,10,0.20) 0 50%,rgba(231,199,101,0.10) 50% 100%);}
  #stage.t-column #progress i{width:100%;background-repeat:no-repeat;background-size:14px 1920px;
    background-image:linear-gradient(180deg,#0A0A0A 0 50%,#F4DF95 50% 100%);}
  #stage.t-column .tick.tl{opacity:1;border-color:rgba(10,10,10,0.72);}
  #stage.t-column .tick.bl{opacity:1;}
  #stage.t-column .scene{justify-content:center;padding:150px 110px 230px 190px;}
  #stage.t-column .h1{font-size:74px;letter-spacing:2px;line-height:1.24;}
  #stage.t-column .h1.sm{font-size:64px;}
  #stage.t-column .odometer{font-size:158px;letter-spacing:0px;}

/* -------------------------------------------------------------- IV · MARGIN
   Everything flush left and set lowercase; stone dominant, one gold figure.
   A heavy gold rule hard against the right edge. */
  #stage.t-margin #progress{right:0;top:0;bottom:0;width:22px;background:rgba(231,199,101,0.16);}
  #stage.t-margin #progress i{width:100%;background:linear-gradient(180deg,#F4DF95,#C9A23F);}
  #stage.t-margin .tick.tr,#stage.t-margin .tick.br{opacity:1;}
  #stage.t-margin .scene{justify-content:center;align-items:flex-start;text-align:left;
    padding:150px 210px 230px 128px;}
  #stage.t-margin .toggle{align-self:flex-start;}
  #stage.t-margin .sub{max-width:690px;font-size:32px;}
  /* italic, NOT lowercase: text-transform would turn $725B into $725b */
  #stage.t-margin .h1{font-size:72px;color:#B9B1A1;letter-spacing:0px;line-height:1.34;}
  #stage.t-margin .h1.sm{font-size:66px;}
  /* OPENER=contrast — scene A only. Skip rate is decided by what the eye can read at
     thumb speed, and the display serif is the least legible thing on the canvas. Set
     const OPENER='contrast' to switch it on. Measured against the control from 17 Aug. */
  #stage.op-contrast #A .h1, #stage.op-contrast #A .h1.sm, #stage.op-contrast #A .h1.sm.gold{
    font-family:'Poppins',sans-serif !important; font-weight:700 !important;
    font-style:normal !important; font-size:96px !important; line-height:1.08 !important;
    letter-spacing:-2.5px !important;}
  #stage.op-contrast #A .h1.sm{color:#FFFFFF !important;}
  #stage.op-contrast #A .h1.sm.gold{background:none !important;
    -webkit-text-fill-color:#E7C765 !important;color:#E7C765 !important;filter:none !important;}
  #stage.t-margin .h1.gold{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#F4F0E7;color:#F4F0E7;filter:none;}
  #stage.t-margin .odometer{font-size:112px;letter-spacing:-2px;}

  /* ---- on gold, BLACK is the accent. .onGold is assigned at load by measured position. ---- */
  #stage.t-column .onGold.kicker{color:#0A0A0A !important;}
  #stage.t-column .onGold .livedot{background:#0A0A0A;box-shadow:0 0 12px rgba(10,10,10,0.30);}
  #stage.t-column .onGold.h1{color:rgba(10,10,10,0.72) !important;}
  #stage.t-column .onGold.h1.gold{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#0A0A0A;color:#0A0A0A !important;filter:none;}
  #stage.t-column .onGold.odometer{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#0A0A0A;color:#0A0A0A;filter:none;}
  #stage.t-column .onGold.sub{color:rgba(10,10,10,0.78) !important;}
  #stage.t-column .onGold.sub b{color:#0A0A0A !important;}
  #stage.t-column .onGold.newschip{color:#0A0A0A;border-color:rgba(10,10,10,0.55);box-shadow:none;}
  #stage.t-column .onGold .chip.build{color:rgba(10,10,10,0.55);border-color:rgba(10,10,10,0.38);}
  #stage.t-column .onGold .chip.use{color:#F4DF95;background:#0A0A0A;border-color:#0A0A0A;box-shadow:none;}
  #stage.t-column .onGold .strike{background:#0A0A0A;}
  #stage.t-column .onGold .arrow{color:#0A0A0A;}
  #stage.t-column .onGold.mono{color:#0A0A0A;}
  #stage.t-column .onGold.mono circle{stroke:#0A0A0A !important;}
  #stage.t-column .onGold.handle{background:none;-webkit-background-clip:border-box;
    background-clip:border-box;-webkit-text-fill-color:#0A0A0A;color:#0A0A0A;filter:none;}
  #stage.t-column .onGold.loopcur{color:rgba(10,10,10,0.60) !important;}

  /* IV · MARGIN — bar down the right edge, type flush left. The analytical one. */
  #stage.t-margin #progress{right:104px;top:210px;bottom:210px;width:4px;}
  #stage.t-margin #progress i{width:100%;background:linear-gradient(180deg,#F4DF95,#C9A23F);}
  #stage.t-margin .tick.tr,#stage.t-margin .tick.br{opacity:1;}
  #stage.t-margin .scene{justify-content:center;align-items:flex-start;text-align:left;
    padding:150px 210px 230px 132px;}
  #stage.t-margin .toggle{align-self:flex-start;}
  #stage.t-margin .sub{max-width:700px;}

  /* ===== TYPED SUBTITLE — the mandatory last-step caption, animated by seek() =====
     Top-centre clear zone by default; VERIFY per theme in the audit (crest owns the
     ceiling band, so drop it lower there). Gold on dark; the light-flip sends it to ink.
     See references/subtitles.md. */
  #subline{position:absolute;left:0;right:0;top:372px;text-align:center;padding:0 160px;
    font-family:'Poppins';font-weight:500;font-size:31px;letter-spacing:0.3px;line-height:1.42;
    opacity:0;z-index:6;pointer-events:none;}
  #subtxt{color:var(--gold);}
  #subcar{display:inline-block;width:3px;height:26px;vertical-align:-3px;margin-left:5px;
    background:var(--gold);border-radius:2px;}
  /* column paints the upper half gold — gold-on-gold washes out, so the caption drops to
     the lower black half there (still gold ink, now on black). */
  #stage.t-column #subline{top:auto;bottom:210px;}
  /* KNOWN, UNFIXED (2026-08-06): column's fold is pinned at 50%, so scene ink runs to
     ~y1232 and there is no clear band left between it and y1300. The caption above is
     therefore still outside the app-safe window on THIS theme only, and the watermark
     stays low here to avoid landing on scene copy. Fixing it means recomposing column
     around the fixed fold — a design pass, not a padding tweak. gate 6 reports it. */
  #stage.t-column #wm{bottom:74px;}
</style>
</head>
<body>
<div id="stage">
  <div id="frame"></div>
  <div id="frame2"></div>
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>
  <div id="scenes"></div>
  <div id="progress"><i></i></div>
  <div id="subline"><span id="subtxt"></span><span id="subcar"></span></div>
  <div id="wm"></div>
</div>

<script>
/* ===== HANDLE — your reel handle, stamped on EVERY frame (footer watermark)
   AND the CTA card. This is the ONE place it is set. Change this single line to
   switch handles everywhere (e.g. '@itsac.ai'). Do not hardcode it elsewhere. ===== */
const HANDLE='@itsac.ai';

/* ===========================  CONTENT  (EDIT THIS)  ===========================
   The ONLY per-video block, together with the THEME constant just below it.
   Replace EVERY field with your verified story before building. Rules: payoff in
   scene A, ONE real number per scene, no em-dashes on screen, big Lora lines
   <= ~16 chars. For an AI-news story keep hook.kicker as 'Breaking · AI' and use
   proof.chip as the news stamp. Full slot guide: references/reel-scenes.md and references/themes.md
   The slots below are NEUTRAL MASTER COPY, not a story. Every field must be
   replaced before rendering. If you see the word "here" on screen, you shipped
   the blank template.
   ============================================================================ */
const CONTENT={
  monogram:'AC',
  // A — LOUD open: state the PAYOFF first; the big proof number is the moment
  hook:{ kicker:'Breaking · AI',
         line1:'Your headline', line2:'lands here.',
         num:{value:0, decimals:0, prefix:'', suffix:'%'},
         label:'One line of context sits under the number.' },
  // B — the reframe as an animated toggle (from is struck, to is gold)
  shift:{ kicker:'Here’s the shift', from:'BEFORE', to:'AFTER',
          line1:'The old reading.', line2:'The new one.' },
  // C — the proof stat (counts up) + a small stamped chip
  proof:{ kicker:'The proof',
          num:{value:0, decimals:0, prefix:'', suffix:'%'},
          label:'<b>The proof stat</b> is<br>stated plainly here.',
          chip:'Second number · Source' },
  // D — the rule / takeaway; line2 echoes scene A so the reel has a spine
  rule:{ line1:'The rule lands.', line2:'Line two here.',
         sub:'Closing beat with <span class="gold">one gold phrase.</span>' },
  // E — CTA + loop (loop line echoes the open so the reel repeats)
  cta:{ handle:HANDLE, tagline:'Daily AI · no hype, no jargon', loop:'the loop line echoes → _' }
};

/* ===== THEME — structural, not lighting. Rotate per video:
   'base' (bar bottom) | 'crest' (bar top) | 'column' (bar left) | 'margin' (bar right) ===== */
const THEME='base';

/* ===== FIGURE — the AC narrator mark. FINALISED 2026-08-13 through a design
   interview with AC. 'off' | 'on'. Default 'off' — OPT-IN PER RUN.
   THE CANONICAL MARK (do not redraw casually): akimbo stance, head tilted 5
   degrees; eye-level sunglasses WITH temple arms (armless bars read as a visor
   — measured 2026-08-13); ONE raised brow above the right lens (the sceptic's
   face; first draft merged with the head rim and read as a hair flick — keep
   the brow clear of the rim); caret mouth, the page's typed-caret signature —
   he does not speak, he types; polo collar with button dot, the ONLY body
   detail (the watch was cut: two accessories read as costume); NO feet ticks
   (AC's call); stroke 7.2 main / 6 hair / 4.6 detail, the poster cut.
   HAIR added 2026-08-13 — variant T3 "tousled", AC's pick from an 8-variant
   sheet. Judged at 140px, not at full size: hair drawn as separate fine
   strands (tousled, textured crop) dissolves into fuzz at reel scale, so what
   survives is anything that changes the SILHOUETTE. Four uneven strands do.
   He has NO NAME — he is AC drawn, captions say "me".
   NARRATOR MODE (2026-08-13, AC's call): he is PERSISTENT across all five
   scenes, standing in the subtitle band, and THE TYPED SUBTITLE IS HIS SPEECH.
   He is a sibling of the scenes, not inside one, so he never fades between
   cuts. His mouth caret is driven by the real subtitle clock in subTick():
   bright while the line is typing, dim between lines — so he actually talks
   for the whole 11.7s using copy that already exists and is already gated.
   Chose the subtitle band because it is the one horizontal lane no scene's
   content enters; putting him beside the scene copy would have forced every

   Enters via standard data-a machinery; light look via --figstroke. Static

/* The AC figure — canonical mark, RIGGED for animation (2026-08-13).
   Arms are two-bone: upper bone drawn along +x from the shoulder and rotated by
   S; forearm pivots at the elbow and is rotated by E. That makes a gesture a
   pair of angles rather than a redrawn path, so poses can be interpolated.
   Named hooks the animator drives: #f-body #f-head #f-mouth #f-armL #f-armR.
   Everything is set from figTick(t) — never CSS animation. */
function acArm(id,S,E){
  return '<g id="'+id+'" transform="translate(105,128) rotate('+S+')">'+
    '<path class="fst" d="M0 0 L46 0"/>'+
    '<g class="fore" transform="translate(46,0) rotate('+E+')">'+
    /* The forearm bone lives in its OWN group so it can be scaled along its
       length (foreshortening, for the point-at-camera) without squashing the
       hand. The hand is r=0 in every normal pose — this mark has no hands. It
       only exists when the arm comes AT the viewer, where a limb shortening
       toward you with nothing on the end reads as an amputation, not a point. */
    '<g class="forescale"><path class="fst" d="M0 0 L38 0"/></g>'+
    '<circle class="fhand fsun" cx="38" cy="0" r="0"/></g></g>';
}
function acFigure(){
  if(typeof FIGURE==='undefined'||FIGURE==='off')return '';
  /* HAIR — T3 "tousled", AC's pick from an eight-variant sheet (2026-08-13).
     Crown arc plus four strands of unequal height and lean; the unevenness is
     the whole point, a symmetrical set reads as a crown, not hair. Drawn INSIDE
     the head group so it tilts with the 5-degree head lean and rides every nod.
     Spike tips sit above the viewBox (y as low as -6) — the svg carries
     overflow:visible for exactly this reason, do not remove it. */
  const hair='<path class="fhr" d="M64 40 Q70 9 105 8 Q141 9 146 40"/>'+
    '<path class="fth" d="M76 20 l4 -11"/><path class="fth" d="M92 11 l-2 -11"/>'+
    '<path class="fth" d="M110 8 l6 -10"/><path class="fth" d="M128 14 l9 -6"/>';
  const head='<g id="f-head" transform="rotate(-5 105 104)">'+
    '<circle cx="105" cy="58" r="46" class="fst"/>'+hair+
    '<path class="fth" d="M113 38 Q123 33 133 37"/>'+
    '<rect x="74" y="45" width="26" height="14" rx="6" class="fsun"/>'+
    '<rect x="110" y="45" width="26" height="14" rx="6" class="fsun"/>'+
    '<path class="fth" d="M100 51 h10"/><path class="fth" d="M74 50 L61 46"/><path class="fth" d="M136 50 L149 46"/>'+
    '<rect id="f-mouth" x="100" y="80" width="10" height="5" rx="2.5" class="fcar"/></g>';
  const torso='<path class="fth" d="M89 108 L96 122 L105 118"/><path class="fth" d="M121 108 L114 122 L105 118"/>'+
    '<circle cx="105" cy="127" r="2.5" class="fsun"/><path class="fst" d="M105 104 v92"/>';
  const legs='<path class="fst" d="M105 196 L86 258"/><path class="fst" d="M105 196 L132 256"/>';
  return '<div class="acfig"><svg width="150" height="207" viewBox="0 0 210 290" style="overflow:visible">'+
    '<g id="f-body">'+head+torso+acArm('f-armL',132,-108)+acArm('f-armR',72,14)+legs+'</g></svg></div>';
}

/* ===== ENGINE ===== */
function clamp(p){return Math.min(1,Math.max(0,p));}
function eOut(p){p=clamp(p);return 1-Math.pow(1-p,3);}
function eBack(p){p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function eExpo(p){p=clamp(p);return p>=1?1:1-Math.pow(2,-10*p);}
function lerp(a,b,p){return a+(b-a)*p;}
function applyA(node,lt){
  const s=node.dataset.a.split(','),d=parseFloat(s[0]),du=parseFloat(s[1]),t=s[2];
  const p=(lt-d)/du,e=eOut(p),b=eBack(p);let tr='';
  if(t==='rise')tr='translateY('+((1-e)*26).toFixed(2)+'px)';
  else if(t==='up')tr='translateY('+((1-e)*48).toFixed(2)+'px)';
  else if(t==='left')tr='translateX('+((1-e)*-50).toFixed(2)+'px)';
  else if(t==='pop')tr='scale('+lerp(0.6,1,b).toFixed(3)+')';
  else if(t==='stamp')tr='rotate(-5deg) scale('+lerp(1.5,1,b).toFixed(3)+')';
  node.style.opacity=clamp(p);node.style.transform=tr;
}

SCENES.forEach(s=>{s.el=document.getElementById(s.id);s.anims=[...s.el.querySelectorAll('[data-a]')];});
const odoA=document.getElementById('odoA'),odoC=document.getElementById('odoC');
const strikeB=document.getElementById('strikeB'),loopc=document.getElementById('loopc');

function sceneAnim(s,lt){
  s.anims.forEach(n=>applyA(n,lt));
  if(s.id==='A'){
    const spec=C.hook.num,p=eExpo((lt-0.5)/1.0),cur=spec.value*clamp(p);
    odoA.textContent=fmt(cur,spec);
    odoA.style.opacity=clamp((lt-0.5)/0.3);
    const g=0.16+0.28*clamp(1-(lt-1.5)/0.45);
    odoA.style.transform='scale('+lerp(0.9,1,eOut((lt-0.5)/0.5)).toFixed(3)+')';
    odoA.style.filter='drop-shadow(0 3px 20px rgba(231,199,101,'+g.toFixed(3)+'))';
  } else if(s.id==='B'){
    strikeB.style.transform='scaleX('+eOut((lt-0.55)/0.4).toFixed(3)+')';
  } else if(s.id==='C'){
    /* eOut over 1.9s, NOT eExpo over 1.1s (changed 2026-08-14, Day 30). eExpo is
       1-2^(-10p): it puts 97% of the count in the first half of its window, so the
       proof number finished ticking ~0.5s into a 2.6s scene and the frame then sat
       dead for the rest of it — gate 4's one surviving failure after the push-in
       landed. Scene C is the sparsest scene in the reel (one number, two lines, a
       chip), so it has the least ink for the push-in to move and needs its own
       onset to run longer. Cubic-out keeps digits changing for ~1.5s. Scene A keeps
       eExpo deliberately: its job is the loud open, where the number has to be
       legible fast (hooks.md v2 rule 1, payload by 2.3s). */
    const spec=C.proof.num,p=eOut((lt-0.3)/1.9),cur=spec.value*clamp(p);
    odoC.textContent=fmt(cur,spec);
    odoC.style.opacity=clamp((lt-0.3)/0.3);
    odoC.style.transform='scale('+lerp(0.9,1,eOut((lt-0.3)/0.5)).toFixed(3)+')';
  } else if(s.id==='E'){
    const circ=s.el.querySelector('.mono circle');
    if(circ){circ.style.strokeDasharray='1';circ.style.strokeDashoffset=(1-eOut((lt-0.1)/0.85)).toFixed(3);}
    if(loopc&&lt>1.2)loopc.style.opacity=(Math.floor(lt*2.2)%2===0)?0.85:0.3;
  }
}
/* ===== RETOUCH FX: build layers once + deterministic per-frame motion ===== */
document.getElementById('stage').className='t-'+THEME
  +(typeof OPENER!=='undefined'&&OPENER!=='default'?' op-'+OPENER:'');
document.getElementById('wm').textContent=HANDLE.toUpperCase();
const __prog=document.querySelector('#progress i');
/* COLUMN and LEDGER run the bar vertically, so the fill grows in height, not width. */
const __VBAR=(THEME==='column'||THEME==='margin');
function fxTick(t){
  if(__prog){const pc=(clamp(t/window.__TOTAL)*100).toFixed(2)+'%';
    if(__VBAR){__prog.style.height=pc;__prog.style.width='100%';}
    else{__prog.style.width=pc;__prog.style.height='100%';}}
}
/* ===== COLUMN: gold above the midline, black below =====
   Nothing may straddle the boundary. For each scene we find the natural gap between two
   lines of content and slide the block so THAT gap lands exactly on the split, then tag
   every element .onGold by where it settled. One pass, no iteration, identical on every
   render. Padding is used rather than transform because seek() owns the scene transform. */
if(THEME==='column'){
  const SPLIT=960, PT0=150, PB0=230, MINGAP=64, TOPLIM=210, BOTLIM=1700;
  document.querySelectorAll('#scenes .scene').forEach(function(sc){
    // real content only — the layout spacers carry no class and must not drive the split
    const kids=[].slice.call(sc.children)
      .filter(function(n){return n.className && n.getBoundingClientRect().height>1;})
      .sort(function(x,y){return x.getBoundingClientRect().top-y.getBoundingClientRect().top;});
    if(kids.length<2) return;
    const R=kids.map(function(n){return n.getBoundingClientRect();});
    let best=null;
    for(let i=1;i<kids.length;i++){
      const gap=R[i].top-R[i-1].bottom, mid=(R[i-1].bottom+R[i].top)/2, shift=SPLIT-mid;
      if(R[0].top+shift<TOPLIM || R[R.length-1].bottom+shift>BOTLIM) continue;
      const cand={gap:gap,shift:shift,ok:gap>=MINGAP};
      if(!best) best=cand;
      else if(cand.ok&&!best.ok) best=cand;
      else if(cand.ok===best.ok){
        if(cand.ok ? Math.abs(cand.shift)<Math.abs(best.shift) : cand.gap>best.gap) best=cand;
      }
    }
    if(best && Math.abs(best.shift)>0.5){
      if(best.shift>0){sc.style.paddingTop=(PT0+2*best.shift)+'px';}
      else{sc.style.paddingBottom=(PB0-2*best.shift)+'px';}
    }
  });
  document.querySelectorAll('#scenes .scene > *').forEach(function(node){
    const r=node.getBoundingClientRect();
    if(r.height>1 && (r.top+r.height/2)<SPLIT) node.classList.add('onGold');
  });
}
/* ===== SUBTITLES — THE MANDATORY LAST STEP. One glanceable caption per scene (A–E),
   matched to the VO. Short fragments only; no em-dashes; shorten hard so each reads in the
   ~0.5s it holds. Leave "" to skip a scene. Themed gold (dark) / ink (light-flip). Position
   + clearance are checked by qa_layout.sh and the eyeball pass. See references/subtitles.md. */
const SUBS=[
  "",  // A · hook
  "",  // B · shift
  "",  // C · proof
  "",  // D · rule / callback
  ""   // E · CTA
];
document.getElementById('stage').insertAdjacentHTML('beforeend',acFigure());
if(typeof FIGURE!=='undefined'&&FIGURE!=='off')document.getElementById('stage').classList.add('hasfig');
const _subL=document.getElementById('subline'),_subT=document.getElementById('subtxt'),_subC=document.getElementById('subcar');
function subTick(t){
  if(!_subL) return;
  let i=-1; for(let k=0;k<SCENES.length;k++){ if(t>=SCENES[k].start-0.0001) i=k; }
  if(i<0){ _subL.style.opacity=0; return; }
  const s=SCENES[i], lt=t-s.start, txt=SUBS[i]||'';
  if(!txt){ _subL.style.opacity=0; return; }
  const n=Math.floor(clamp((lt-0.3)/2.0)*txt.length);
  _subT.textContent=txt.slice(0,Math.max(0,n));
  const typing=n>0&&n<txt.length;
  _subC.style.opacity=typing?1:((Math.floor(t*2.2)%2===0)?1:0.12);
  /* the last scene's subtitle does not fade either - it is the first half of
     scene A's opening sentence and has to be on screen at the loop cut. */
  const fin=clamp(lt/0.35),fout=(i===SCENES.length-1)?1:clamp((s.dur-lt)/0.35);
  _subL.style.opacity=clamp(Math.min(fin,fout));
}
/* ===================== NARRATOR ANIMATION (2026-08-13) =====================
   AC's brief: talking, hand gestures, pauses, synced to the VO. He records the
   voice separately, so this is SCRIPT-TIMED — keyed to the beat sheet's VO
   timecodes, which is what he reads to. Swapping in a real recording later means
   replacing SPEECH[] with measured intervals; nothing else changes.

   Craft rules applied: gestures arrive slightly BEFORE the word they punctuate
   (anticipation); arms and head never move in lockstep (overlapping action);
   every move eases, nothing linear; and a pose SETTLES AND HOLDS between beats,
   because constant motion reads as jitter while a held pose reads as confidence.

   HARD RULE: every value below is a pure function of t. No CSS transitions, no
   randomness, no Date. Two bugs earlier today came from breaking exactly that —
   a CSS transition made the ink gate see phantom ink on every element, and a
   composition change with no motion intent dropped gate 4 below its floor.

   SECOND HARD RULE, added with the sign-off: THE REEL IS A LOOP, so t=LOOP and
   t=0 are adjacent frames and every continuous quantity must agree across that
   seam — oscillator phase, pose, head angle, and the scene-E step-forward. The
   first and last GEST keys are therefore the same pose, and the oscillator
   frequencies are derived from LOOP rather than typed. */
const POSES={
  rest :{lS:132,lE:-108,rS: 72,rE: 14},
  wave :{lS:132,lE:-108,rS: 28,rE: 44},
  shrug:{lS:152,lE: -88,rS: 28,rE:-88},
  point:{lS:132,lE:-108,rS: 20,rE: -8},
  palms:{lS:185,lE:  40,rS: -5,rE:-40},
  palms2:{lS:198,lE: 54,rS:-18,rE:-54},   /* the settle inside the hold */
  cut  :{lS:132,lE:-108,rS:  0,rE:  0},
  /* ---- THE SIGN-OFF, added 2026-08-13 (AC: "waving bye or some interaction
     with the audience"). Angles are geometry, not taste: the head is a circle
     r=46 at (105,58) and the elbow lands at (149,114), so a forearm any steeper
     than about -80 degrees total puts the hand ON HIS FACE. rS -18 / rE -46
     parks the hand up and OUTSIDE the rim with room for a 20-degree swing
     either way — checked at both extremes before it was typed. ---- */
  waveup   :{lS:132,lE:-108,rS:-18,rE:-46},
  /* Pointing AT CAMERA in a flat 2D mark cannot be done with angle alone: an
     arm aimed at the viewer is FORESHORTENED. rF scales the forearm bone along
     its own length, so the limb shortens toward you instead of swinging across.
     That is the whole trick — the angle barely changes, the length does. */
  /* The point aims UP-and-forward, never level. He stands IN the subtitle lane,
     so his shoulder is at caption height — a level point puts his hand through
     the first word. Measured: level reached x=356 with the copy starting at
     x=275. Angled up, the hand clears the cap line entirely. */
  pointcam :{lS:132,lE:-108,rS:-34,rE: 26,rF:0.38},
  pointcam2:{lS:132,lE:-108,rS:-40,rE: 32,rF:0.32}   /* settle inside the point */
};
/* {t: the moment the pose is REACHED, p: pose, h: head rotation}
   Between keys he HOLDS. Transitions run TR seconds and land on t. */
const GEST=[
  /* THE LOOP SEAM. This key is a deliberate copy of the LAST key in the track:
     he is still mid-wave when the reel restarts, so t=LOOP and t=0 are the same
     drawing and the loop has no snap. Every oscillator below is tuned to agree
     with it. If you ever retime scene E, retime THIS line in the same edit. */
  {t:0.00,p:'waveup',h:6},
  {t:0.62,p:'wave', h:0},    // hand sweeps down out of the wave into the dismissal
  {t:1.45,p:'rest', h:10},   // turns to watch 650 count up
  {t:2.50,p:'rest', h:0},
  {t:3.00,p:'shrug',h:-4},   // "the only human help was encouragement"
  {t:4.40,p:'rest', h:0},
  {t:5.40,p:'rest', h:14},   // turns to the 30
  {t:5.85,p:'point',h:12},
  {t:6.50,p:'cut',  h:0},    // "got nowhere"
  {t:7.00,p:'rest', h:0},
  {t:7.90,p:'palms',h:0},    // "you are not bad at this" - the long hold
  /* A HOLD IS NEVER FROZEN. This settle beat exists for two reasons and they
     agree: animators keep a "moving hold" because a dead pose looks like a
     paused video, and gate 4 measured a 1.03s static window at 8.40s when the
     pose truly stopped. Small delta, reads as him letting the line land. */
  {t:8.55,p:'palms2',h:9},   // settle + a nod: the head is the biggest ink on
  {t:9.05,p:'palms', h:2},   // him, so a nod buys far more motion per degree
  {t:9.35,p:'rest', h:0},
  /* ---- SCENE E · the sign-off. 1.8s holds three beats (AC chose to compress
     rather than extend the reel), so these keys carry SHORT tr overrides — the
     0.34s default would smear one beat into the next and read as a single
     twitch instead of wave, address, wave. ---- */
  {t: 9.92,p:'waveup',   h: 6, tr:0.30},  // hand goes up: the goodbye starts
  {t:10.44,p:'waveup',   h:10, tr:0.22},  // still up, head leans into it
  {t:10.70,p:'pointcam', h:-2, tr:0.20},  // turns the hand to YOU on the binary
  {t:11.00,p:'pointcam2',h: 5, tr:0.24},  // moving hold - never freeze a beat
  {t:11.18,p:'waveup',   h: 6, tr:0.16}   // back up, and waves through the seam
];
const TR=0.34;
/* VO speech windows, from the beat sheet timings. Mouth only moves inside these. */
const SPEECH=[[0.10,2.45],[2.70,4.85],[5.10,7.35],[7.60,9.45],[9.70,11.25]];
function _ez(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}          // easeInOutCubic
function _bk(p){const c=1.70158+1;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);} // slight overshoot
function _sm(p){p=clamp(p);return p*p*(3-2*p);}                        // smoothstep

/* ===== LOOP-COMMENSURATE OSCILLATORS =====
   A reel is watched as a loop, so t=LOOP and t=0 are ADJACENT FRAMES. Any
   sin(t*w) whose period does not divide LOOP lands on a different value at each
   end and shows as a twitch every time the video restarts. So the frequencies
   below are DERIVED from LOOP (an integer number of cycles must fit), never
   typed by hand. The old breathing rate of 2.62 rad/s fitted 4.75 cycles into
   11.4s and left a 7px vertical jump at the seam — invisible once, a tic by the
   tenth loop, and the exact reason this comment exists. */
const LOOP=Math.max(...SCENES.map(s=>s.start+s.dur));
const W_BR=2*Math.PI* 5/LOOP;   // breathing, ~5 breaths per loop
const W_WV=2*Math.PI*32/LOOP;   // wave swing, ~0.36s per stroke

/* Wave amplitude envelope. Two bursts. The first is the goodbye inside scene E
   and dies before the hand turns to camera. The second has a rising edge and NO
   falling edge before LOOP, and its continuation after 0 has a falling edge and
   no rising one — so the value at t=LOOP and at t=0 is 1 on both sides and he
   is still waving as the reel restarts. That is AC's "waving through the loop." */
function waveEnv(t){
  if(t>=9.78&&t<=10.55) return _sm((t-9.78)/0.22)*(1-_sm((t-10.26)/0.22));
  if(t>=11.04)          return _sm((t-11.04)/0.20);
  if(t<=0.40)           return 1-_sm((t-0.10)/0.30);
  return 0;
}
/* The step forward: 0 outside scene E, 1 at full stride. Returns to 0 by LOOP so
   the seam matches frame 0 — he steps toward you, then settles back as it loops. */
function figStep(t){
  if(t<9.62)  return 0;
  if(t<10.34) return _ez((t-9.62)/0.72);
  if(t<11.02) return 1;
  return 1-_ez(clamp((t-11.02)/0.38));
}
function figTick(t){
  const fb=document.getElementById('f-body'); if(!fb) return;
  // ---- which keyframe pair are we between ----
  let i=0; for(let k=0;k<GEST.length;k++){ if(t>=GEST[k].t-(GEST[k].tr||TR)) i=k; }
  const cur=GEST[i], prev=GEST[Math.max(0,i-1)], tr=cur.tr||TR;
  let raw=(t-(cur.t-tr))/tr; raw=Math.max(0,Math.min(1,raw));
  const toRest=cur.p==='rest';
  const e=toRest?_ez(raw):_bk(raw);                 // returns settle, gestures pop
  const A=POSES[prev.p], B=POSES[cur.p];
  const mix=(a,b)=>a+(b-a)*e;
  const wv=Math.sin(t*W_WV)*waveEnv(t);             // -1..1, already enveloped
  let hRot=prev.h+(cur.h-prev.h)*_ez(raw);
  hRot+=Math.sin(t*W_WV/2)*2.2*waveEnv(t);          // head sways with the wave
  // ---- breathing: continuous, carries the holds ----
  const br=Math.sin(t*W_BR)*7.0;
  const hb=Math.sin(t*W_BR+0.6)*1.9;               // head lags the chest
  fb.setAttribute('transform','translate(0,'+br.toFixed(2)+')');
  const hd=document.getElementById('f-head');
  if(hd) hd.setAttribute('transform','rotate('+(-5+hRot+hb).toFixed(2)+' 105 104)');
  // ---- the step forward: written on the WRAPPER, not the svg, so it scales the
  //      whole mark from his feet (transform-origin is set in CSS) ----
  const sp=figStep(t), fig=document.querySelector('.acfig');
  // 34px, not more: the subtitle lane starts at x=274 and does NOT move with him,
  // so the step forward is bounded by his own pointing hand reaching the copy
  if(fig) fig.style.transform='translateX('+(34*sp).toFixed(2)+'px) scale('+(1+0.15*sp).toFixed(4)+')';
  const aL=document.getElementById('f-armL'), aR=document.getElementById('f-armR');
  if(aL){ aL.setAttribute('transform','translate(105,128) rotate('+mix(A.lS,B.lS).toFixed(2)+')');
          aL.querySelector('.fore').setAttribute('transform','translate(46,0) rotate('+mix(A.lE,B.lE).toFixed(2)+')'); }
  if(aR){ aR.setAttribute('transform','translate(105,128) rotate('+mix(A.rS,B.rS).toFixed(2)+')');
          // the wave rides ON TOP of the interpolated pose, so a swing and a
          // pose change can happen at once without one cancelling the other
          const rE=mix(A.rE,B.rE)+wv*20, rF=mix(A.rF||1,B.rF||1);
          aR.querySelector('.fore').setAttribute('transform','translate(46,0) rotate('+rE.toFixed(2)+')');
          aR.querySelector('.forescale').setAttribute('transform','scale('+rF.toFixed(3)+',1)');
          // hand grows as the forearm shortens — one value, so it can never pop
          const hn=aR.querySelector('.fhand');
          hn.setAttribute('cx',(38*rF).toFixed(2));
          hn.setAttribute('r',(Math.max(0,1-rF)*19).toFixed(2)); }
  // ---- mouth: two-state, only inside a speech window ----
  const m=document.getElementById('f-mouth'); if(!m) return;
  let talking=false; for(const w of SPEECH){ if(t>=w[0]&&t<=w[1]){talking=true;break;} }
  // aperiodic but deterministic, so it reads as syllables not a metronome
  const osc=Math.sin(t*27.3)+0.55*Math.sin(t*41.7)+0.3*Math.sin(t*17.1);
  const open=talking&&osc>0.1;
  if(open){ m.setAttribute('x',99); m.setAttribute('y',70); m.setAttribute('width',12); m.setAttribute('height',18); m.setAttribute('rx',6); }
  else    { m.setAttribute('x',100);m.setAttribute('y',80); m.setAttribute('width',10); m.setAttribute('height',5);  m.setAttribute('rx',2.5); }
}
window.__TOTAL=Math.max(...SCENES.map(s=>s.start+s.dur));
window.seek=function(t){
  fxTick(t);
  subTick(t);
  figTick(t);
  /* LOOP SEAM — the last scene NEVER fades out, and it holds through the render
     tail. Symmetric with scene A being live on frame 0: the reel opens on a full
     frame and it closes on a full frame, so the loop cuts straight from the CTA
     into the loud open. Before this (found 2026-08-14, Day 30) scene E faded to
     nothing over its last 0.24s and the 0.3s tail rendered empty, so every reel
     spent its final ~0.5s dying to a black frame — which is the worst possible
     place for it on a format whose whole strategy is the rewatch. Costs nothing
     and needs no SCENES change, so the audio cue map is untouched. */
  const LAST=SCENES.length-1;
  SCENES.forEach((s,i)=>{
    const st=t-s.start,IN=0.22,OUT=0.24,isLast=(i===LAST);let vis=0;
    if(st>=-0.0001&&(isLast||st<=s.dur)){
      if(s.start<=0.0001){ vis=(st>s.dur-OUT)?(s.dur-st)/OUT:1; }   // loud open: scene A live on frame 0
      else if(st<IN)vis=st/IN;
      else if(!isLast&&st>s.dur-OUT)vis=(s.dur-st)/OUT;
      else vis=1;
    }
    vis=clamp(vis);s.el.style.opacity=vis;s.el.style.visibility=vis>0.002?'visible':'hidden';
    /* SETTLE, then a slow continuous PUSH-IN for the rest of the scene.
       Found 2026-08-14 (Day 30): gate 4 had been passing on the scene FADES, not on
       content. The moment the loop-seam fix above removed the last fade, four windows
       over 1.0s appeared at once — scenes were going genuinely static as soon as their
       one animation finished, and the cross-fades were papering over it. A 3% push-in
       keeps every frame alive without adding a single noisy element, which is the calm
       way to hold a floor on a page whose whole look is stillness. Bounds are safe: the
       scenes carry 150px/110px padding and gates 1, 2 and 6 are re-run against it. */
    const settle=lerp(1.03,1,clamp(st/0.35));
    const push=1+0.03*clamp((st-0.35)/Math.max(0.35,s.dur-0.35));
    s.el.style.transform=vis>0.002?'scale('+(settle*push).toFixed(4)+')':'none';
    if(vis>0.002)sceneAnim(s,st);
  });
};
window.seek(0);document.title='ready';
</script>
