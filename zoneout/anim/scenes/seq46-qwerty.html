<!doctype html>
<html><head><meta charset="utf-8"><title>ZoneOut · seq 46 · QWERTY</title>
<style>html,body{margin:0;padding:0;background:#0B0B0C;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from '../lib/three.module.min.js';
import { PALETTE, textTexture, lightRig, stage, lerp } from '../lib/zoneout.js';
import { E, cue, push, motionAudit, resetAudit } from '../lib/motion.js';

/* THE ORIGIN BEAT, as a picture. This is the channel's whole position in one shot:
 * somebody wrote it down, everybody copied it, somebody corrected it — and the copying
 * never stopped.
 *
 * WHY THIS SCENE AND NOT ANOTHER. SKILL.md is explicit that the origin beat is the
 * product ("the only thing a stock clip and a synthetic voice cannot produce"), that it
 * is the follow signal and the originality defence, and that it currently sits at beat 6
 * where roughly two-thirds of viewers never arrive. It is also literally unshowable with
 * stock: there is no clip of "a claim propagating uncorrected for 260 years".
 *
 * PARAMETERISED, so it is a scene TYPE rather than a one-off. Set ORIGIN/CORRECTION and
 * it serves any video in the correction lane.
 *
 * Grey is the wrong or old version; gold is the correction. Same law as the covers, so
 * the argument reads before a word does.
 *
 * MOTION: sequenced under lib/motion.js. One thing moves at a time, two dead holds, and
 * exactly one camera move at the end. window.__AUDIT carries the proof. */

/* SEQ 46 · QWERTY. The origin-line, parameterised — this file changes four constants
 * and nothing else, which is the point of the scene being a TYPE.
 *
 * LABELS ARE DELIBERATELY NOT "WRITTEN DOWN / CORRECTED". The adversarial pass could not
 * find a dated first-writing of the "designed to slow you down" claim, and the sources
 * actively disagree about the layout's real cause: the mainstream account is type-bar
 * jam prevention, while Yasuoka & Yasuoka (Kyoto, 2011) argue it came from telegraph
 * operators transcribing Morse. Labelling 1873 as "where the lie started" would assert
 * something no source supports.
 *
 * So the line carries what IS agreed: the layout shipped in 1873, it was re-examined in
 * 2011, and the sabotage story kept being repeated either way. Every account agrees
 * slowing the typist was never the GOAL — that is the claim the video makes, and it is
 * the only one that survives the disagreement. */
const ORIGIN     = { year: '1873', label: 'LAYOUT SHIPS' };
const CORRECTION = { year: '2011', label: 'RE-EXAMINED' };
const N_COPIES   = 11;         // a century and a half of the story being retold
const N_AFTER    = 5;          // and it carries on being retold after the paper

const { renderer, scene, camera } = stage({ fov: 38, z: 9 });
lightRig(scene);
const hex = n => '#' + n.toString(16).padStart(6, '0');

/* ---- the axis: time, left to right ---- */
const AXIS_Y = -0.15, AXIS_HALF = 1.62;
const axis = new THREE.Mesh(
  new THREE.BoxGeometry(1, 0.012, 0.012),
  new THREE.MeshStandardMaterial({ color: PALETTE.grey, emissive: PALETTE.grey,
    emissiveIntensity: 0.5, roughness: 0.6 }));
axis.position.set(0, AXIS_Y, 0);
scene.add(axis);

function tick(x, h, colour, emissive) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.030, h, 0.030),
    new THREE.MeshStandardMaterial({ color: colour, emissive: colour,
      emissiveIntensity: emissive, roughness: 0.5 }));
  m.position.set(x, AXIS_Y + h / 2, 0);
  m.scale.y = 0;
  scene.add(m);
  return m;
}

function label(text, x, y, { size = 74, colour = PALETTE.white, w = 3.0 } = {}) {
  const tex = textTexture(text, { w: 700, h: 220, size, weight: 700, color: hex(colour) });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 220 / 700),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0 }));
  m.position.set(x, y, 0.02);
  scene.add(m);
  return m;
}

/* origin at the far left, correction ~72% along — the gap IS the story */
const X0 = -AXIS_HALF + 0.12, X1 = AXIS_HALF - 0.10;
const X_CORR = lerp(X0, X1, 0.72);

const originTick = tick(X0, 0.62, PALETTE.gold, 0.9);
const originYr   = label(ORIGIN.year,  X0 + 0.30, AXIS_Y + 0.92, { size: 90, colour: PALETTE.gold });
const originLbl  = label(ORIGIN.label, X0 + 0.46, AXIS_Y - 0.34, { size: 44, colour: PALETTE.grey, w: 2.4 });

/* the copies: every uncritical repetition, grey, between origin and correction */
const copies = [];
for (let i = 0; i < N_COPIES; i++) {
  const p = (i + 1) / (N_COPIES + 1);
  copies.push(tick(lerp(X0, X_CORR, p), 0.26, PALETTE.grey, 0.35));
}

const corrTick = tick(X_CORR, 0.62, PALETTE.gold, 0.9);
const corrYr   = label(CORRECTION.year,  X_CORR + 0.02, AXIS_Y + 0.92, { size: 90, colour: PALETTE.gold });
const corrLbl  = label(CORRECTION.label, X_CORR + 0.02, AXIS_Y - 0.34, { size: 44, colour: PALETTE.gold, w: 2.4 });

/* the copies that keep going AFTER the correction. The argument. */
const after = [];
for (let i = 0; i < N_AFTER; i++) {
  const p = (i + 1) / (N_AFTER + 0.6);
  after.push(tick(lerp(X_CORR, X1, p), 0.26, PALETTE.grey, 0.35));
}

/* NO "STILL REPEATED" LABEL. Two attempts at placing one both clipped the frame edge,
 * and the second attempt is what made the real answer obvious: the label was never needed.
 * Grey ticks continuing past the gold correction marker ALREADY say it, in the colour
 * law the covers use — and the voice says it out loud in the same beat. evidence-format's
 * rule is that a card must show what the voice does NOT say, so a caption here is doubled
 * on screen by definition. Deleted rather than repositioned. */

window.__TOTAL = 5.0;
resetAudit();

window.seek = (t) => {
  // 1 · the axis draws
  const ax = cue(t, 0.00, 0.60, E.outQuint, 'axis');
  axis.scale.x = ax * (AXIS_HALF * 2);

  //   HOLD 0.60 - 0.85

  // 2 · the origin: one tick, one year. Where the lie started.
  const o = cue(t, 0.85, 0.45, E.outQuint, 'origin');
  originTick.scale.y = o;
  originYr.material.opacity = o;
  originLbl.material.opacity = o * 0.85;

  //   HOLD 1.30 - 1.60

  // 3 · the copies march right. ONE cue, staggered inside it — a row building is a
  //     single gesture, not nine competing ones.
  const march = cue(t, 1.60, 1.30, E.linear, 'copies');
  copies.forEach((m, i) => {
    const local = Math.min(1, Math.max(0, (march * N_COPIES) - i));
    m.scale.y = E.outQuint(local);
  });

  // 4 · the correction lands
  const c = cue(t, 3.00, 0.40, E.outQuint, 'correction');
  corrTick.scale.y = c;
  corrYr.material.opacity = c;
  corrLbl.material.opacity = c;

  //   HOLD 3.40 - 3.70  — the beat where a viewer thinks it ends

  // 5 · and the copying carries on anyway
  const cont = cue(t, 3.70, 0.90, E.linear, 'after');
  after.forEach((m, i) => {
    const local = Math.min(1, Math.max(0, (cont * N_AFTER) - i));
    m.scale.y = E.outQuint(local);
  });

  /* One camera move, riding the last cue only.
   *
   * NO LATERAL PUSH. The first version tracked right to x=0.28 to emphasise the ticks
   * continuing past the correction, and cropped "1758" off the left edge by t=5.0 -
   * which deletes half the argument. The origin and the correction have to be readable
   * in the SAME frame or the scene says nothing. A slow push-in does the emphasis
   * without moving anything out of shot. */
  const cam = push(t, 3.70, 1.30);
  camera.position.set(0, lerp(0, -0.04, cam), lerp(9, 8.62, cam));
  camera.lookAt(0, AXIS_Y + 0.12, 0);

  renderer.render(scene, camera);
};

window.seek(0);
window.__AUDIT = motionAudit(window.__TOTAL, 2);
window.__READY = true;
</script></body></html>
