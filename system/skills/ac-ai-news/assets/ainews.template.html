<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  AC — AI NEWS · Reel timeline engine (deterministic seek(t))
  ============================================================================
  FRONT-LOADED breaking-news reel. Sub-12s. Payoff-first, loud open (no fade
  from black), one visual "moment" per scene, loop callback at the end.
  TO MAKE A NEW VIDEO: edit only the CONTENT object near the bottom. Do NOT
  change SCENES timings unless you also update cue times in ainews_audio.py.
  ============================================================================
-->
<style>
  :root{
    --black:#0A0A0A; --gold:#E7C765; --gold-deep:#C9A23F; --gold-light:#F4DF95;
    --white:#F4F0E7; --stone:#B9B1A1; --grey:#6f6a60;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(circle at 50% 42%, rgba(231,199,101,0.08), rgba(231,199,101,0) 46%),
      radial-gradient(ellipse at 50% 45%, #16130E 0%, #0B0B0A 58%, #070706 100%);}
  #frame{position:absolute;inset:46px;border:1.5px solid rgba(231,199,101,0.34);}
  .tick{position:absolute;width:44px;height:44px;}
  .tick.tl{top:34px;left:34px;border-top:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.tr{top:34px;right:34px;border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  .tick.bl{bottom:34px;left:34px;border-bottom:2.5px solid var(--gold);border-left:2.5px solid var(--gold);}
  .tick.br{bottom:34px;right:34px;border-bottom:2.5px solid var(--gold);border-right:2.5px solid var(--gold);}
  #wm{position:absolute;bottom:74px;left:0;width:100%;text-align:center;
    font-family:'Poppins';font-weight:500;letter-spacing:6px;font-size:24px;color:rgba(231,199,101,0.5);}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:150px 110px 230px;text-align:center;visibility:hidden;}
  .el{opacity:0;will-change:transform,opacity;}

  .kicker{font-family:'Poppins';font-weight:600;font-size:29px;letter-spacing:7px;color:var(--gold);text-transform:uppercase;}
  .kicker .dot{color:rgba(231,199,101,0.5);margin:0 10px;}
  .livedot{display:inline-block;width:15px;height:15px;border-radius:50%;background:var(--gold);
    margin-right:16px;vertical-align:middle;box-shadow:0 0 14px var(--gold);}
  .h1{font-family:'Lora';font-weight:600;font-size:82px;line-height:1.1;color:var(--white);letter-spacing:-0.5px;}
  .h1.sm{font-size:70px;}
  .gold{background:linear-gradient(118deg,#F4DF95 0%,#E7C765 46%,#C9A23F 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 14px rgba(231,199,101,0.16));}
  .sub{font-family:'Poppins';font-weight:400;font-size:37px;line-height:1.4;color:var(--stone);max-width:820px;}
  .sub b{color:var(--white);font-weight:600;}

  .odometer{font-family:'Lora';font-weight:700;font-size:150px;line-height:1;letter-spacing:-3px;}

  /* B — build/use toggle */
  .toggle{display:flex;align-items:center;gap:34px;}
  .chip{font-family:'Poppins';font-weight:700;font-size:46px;letter-spacing:3px;padding:16px 42px;border-radius:14px;
    text-transform:uppercase;position:relative;}
  .chip.build{color:var(--stone);border:2.5px solid rgba(185,177,161,0.5);}
  .chip.use{color:#0A0A0A;background:linear-gradient(118deg,#F4DF95,#C9A23F);border:2.5px solid var(--gold);
    box-shadow:0 0 44px rgba(231,199,101,0.28);}
  .arrow{font-family:'Poppins';font-weight:700;font-size:52px;color:var(--gold);}
  .strike{position:absolute;left:22px;right:22px;top:calc(50% - 3px);height:6px;border-radius:4px;
    background:linear-gradient(90deg,#F4DF95,#C9A23F);transform-origin:left center;transform:scaleX(0);}

  /* C — news stamp chip */
  .newschip{font-family:'Poppins';font-weight:600;font-size:31px;letter-spacing:1px;color:var(--gold);
    border:2px solid var(--gold);border-radius:12px;padding:13px 28px;box-shadow:0 0 30px rgba(231,199,101,0.16);}

  /* E — CTA */
  .mono{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center;
    font-family:'Lora';font-weight:600;font-size:74px;color:var(--gold);}
  .mono svg{position:absolute;inset:0;}
  .handle{font-family:'Lora';font-weight:600;font-size:80px;}
  .loopcur{font-family:'Poppins';font-weight:500;font-size:32px;letter-spacing:3px;color:rgba(231,199,101,0.62);}
</style>
</head>
<body>
<div id="stage">
  <div id="frame"></div>
  <div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>
  <div id="scenes"></div>
  <div id="wm">@AC.WINS</div>
</div>

<script>
/* =========================================================================
   ============================  CONTENT  ==================================
   The ONLY block to edit for a new AI-News reel. Keep headline lines short
   (<= ~16 chars for the big Lora lines). No em-dashes anywhere. The order is
   deliberately payoff-first: the thesis + proof number lead scene A.
   ========================================================================= */
const CONTENT={
  monogram:'AC',
  // A — LOUD open: thesis first (payoff), big proof number as the moment
  hook:{ kicker:'Breaking · AI',
         line1:'You don’t need', line2:'to build AI.',
         num:{value:2.5, decimals:1, prefix:'$', suffix:'B'},
         label:'Microsoft just bet on it.' },
  // B — the reframe as an animated BUILD -> USE toggle
  shift:{ kicker:'Here’s the shift', from:'BUILD', to:'USE',
          line1:'Building it is easy.', line2:'Using it is the hard part.' },
  // C — the proof stat (counts up) + a news stamp chip
  proof:{ kicker:'The proof',
          num:{value:6000, decimals:0, prefix:'', suffix:''},
          label:'<b>real humans</b> sent into<br>normal businesses to use it',
          chip:'Amazon matched it · +$1B' },
  // D — the rule / takeaway (callback to the open) + final proof stat
  rule:{ line1:'Stop building AI.', line2:'Start using it.',
         sub:'Firms that do it well: <span class="gold">worth 130% more.</span>' },
  // E — CTA + loop (the loop line echoes the open so the reel repeats)
  cta:{ handle:'@itsac.ai', tagline:'Daily AI · no hype, no jargon', loop:'don’t build. use. → _' }
};

/* ===== SCENE TIMINGS (fixed — audio cues in ainews_audio.py match these) ===== */
const SCENES=[
  {id:'A',start:0.0,dur:2.7},{id:'B',start:2.6,dur:2.5},{id:'C',start:5.0,dur:2.6},
  {id:'D',start:7.5,dur:2.2},{id:'E',start:9.6,dur:1.8}
];

/* ===== helpers ===== */
function el(cls,html,a,st){return '<div class="'+cls+' el"'+(a?' data-a="'+a+'"':'')+(st?' style="'+st+'"':'')+'>'+(html||'')+'</div>';}
function fmt(cur,spec){let s; if(spec.decimals>0){s=cur.toLocaleString('en-US',{minimumFractionDigits:spec.decimals,maximumFractionDigits:spec.decimals});}else{s=Math.round(cur).toLocaleString('en-US');} return (spec.prefix||'')+s+(spec.suffix||'');}
const C=CONTENT;
const dot='<span class="livedot"></span>';

/* ===== BUILD SCENE DOM ===== */
const root=document.getElementById('scenes');
root.innerHTML=`
<div class="scene" id="A">
  ${el('kicker',dot+C.hook.kicker,'-0.3,0.25,fade')}
  <div style="height:12px"></div>
  ${el('h1 sm',C.hook.line1,'-0.3,0.25,up')}
  ${el('h1 sm gold',C.hook.line2,'-0.22,0.28,up')}
  <div style="height:30px"></div>
  <div class="odometer gold" id="odoA" style="font-size:134px">$0.0B</div>
  ${el('sub',C.hook.label,'1.55,0.5,rise')}
</div>
<div class="scene" id="B">
  ${el('kicker',C.shift.kicker,'0,0.4,fade')}
  <div style="height:34px"></div>
  <div class="toggle">
    <div class="chip build el" data-a="0.2,0.4,pop">${C.shift.from}<div class="strike" id="strikeB"></div></div>
    <div class="arrow el" data-a="0.72,0.4,pop">&rarr;</div>
    <div class="chip use el" data-a="0.95,0.45,pop">${C.shift.to}</div>
  </div>
  <div style="height:44px"></div>
  ${el('h1 sm',C.shift.line1,'1.5,0.5,up','color:var(--stone);font-size:54px')}
  ${el('h1 sm gold',C.shift.line2,'1.72,0.5,up','font-size:54px')}
</div>
<div class="scene" id="C">
  ${el('kicker',C.proof.kicker,'0,0.4,fade')}
  <div style="height:16px"></div>
  <div class="odometer gold" id="odoC">0</div>
  ${el('sub',C.proof.label,'1.4,0.5,rise')}
  <div style="height:28px"></div>
  ${el('newschip',C.proof.chip,'1.62,0.42,stamp')}
</div>
<div class="scene" id="D">
  ${el('h1',C.rule.line1,'0.1,0.5,up','color:var(--stone)')}
  ${el('h1 gold',C.rule.line2,'0.34,0.55,up')}
  <div style="height:30px"></div>
  ${el('sub',C.rule.sub,'0.9,0.55,rise')}
</div>
<div class="scene" id="E">
  <div class="mono el" data-a="0.1,0.5,pop"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" pathLength="1" style="fill:none;stroke:var(--gold);stroke-width:2.5"/></svg>${C.monogram}</div>
  ${el('handle gold',C.cta.handle,'0.45,0.5,up')}
  ${el('kicker',C.cta.tagline,'0.85,0.5,rise')}
  <div style="height:26px"></div>
  <div class="loopcur el" id="loopc" data-a="1.2,0.5,fade">${C.cta.loop}</div>
</div>
`;

/* ===== ENGINE ===== */
function clamp(p){return Math.min(1,Math.max(0,p));}
function eOut(p){p=clamp(p);return 1-Math.pow(1-p,3);}
function eBack(p){p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function eExpo(p){p=clamp(p);return p>=1?1:1-Math.pow(2,-10*p);}
function lerp(a,b,p){return a+(b-a)*p;}
function applyA(node,lt){
  const s=node.dataset.a.split(','),d=parseFloat(s[0]),du=parseFloat(s[1]),t=s[2];
  const p=(lt-d)/du,e=eOut(p),b=eBack(p);let tr='';
  if(t==='rise')tr='translateY('+((1-e)*26).toFixed(2)+'px)';
  else if(t==='up')tr='translateY('+((1-e)*48).toFixed(2)+'px)';
  else if(t==='left')tr='translateX('+((1-e)*-50).toFixed(2)+'px)';
  else if(t==='pop')tr='scale('+lerp(0.6,1,b).toFixed(3)+')';
  else if(t==='stamp')tr='rotate(-5deg) scale('+lerp(1.5,1,b).toFixed(3)+')';
  node.style.opacity=clamp(p);node.style.transform=tr;
}

SCENES.forEach(s=>{s.el=document.getElementById(s.id);s.anims=[...s.el.querySelectorAll('[data-a]')];});
const odoA=document.getElementById('odoA'),odoC=document.getElementById('odoC');
const strikeB=document.getElementById('strikeB'),loopc=document.getElementById('loopc');

function sceneAnim(s,lt){
  s.anims.forEach(n=>applyA(n,lt));
  if(s.id==='A'){
    const spec=C.hook.num,p=eExpo((lt-0.5)/1.0),cur=spec.value*clamp(p);
    odoA.textContent=fmt(cur,spec);
    odoA.style.opacity=clamp((lt-0.5)/0.3);
    const g=0.16+0.28*clamp(1-(lt-1.5)/0.45);
    odoA.style.transform='scale('+lerp(0.9,1,eOut((lt-0.5)/0.5)).toFixed(3)+')';
    odoA.style.filter='drop-shadow(0 3px 20px rgba(231,199,101,'+g.toFixed(3)+'))';
  } else if(s.id==='B'){
    strikeB.style.transform='scaleX('+eOut((lt-0.55)/0.4).toFixed(3)+')';
  } else if(s.id==='C'){
    const spec=C.proof.num,p=eExpo((lt-0.3)/1.1),cur=spec.value*clamp(p);
    odoC.textContent=fmt(cur,spec);
    odoC.style.opacity=clamp((lt-0.3)/0.3);
    odoC.style.transform='scale('+lerp(0.9,1,eOut((lt-0.3)/0.5)).toFixed(3)+')';
  } else if(s.id==='E'){
    const circ=s.el.querySelector('.mono circle');
    if(circ){circ.style.strokeDasharray='1';circ.style.strokeDashoffset=(1-eOut((lt-0.1)/0.85)).toFixed(3);}
    if(loopc&&lt>1.2)loopc.style.opacity=(Math.floor(lt*2.2)%2===0)?0.85:0.3;
  }
}
window.__TOTAL=Math.max(...SCENES.map(s=>s.start+s.dur));
window.seek=function(t){
  SCENES.forEach(s=>{
    const st=t-s.start,IN=0.22,OUT=0.24;let vis=0;
    if(st>=-0.0001&&st<=s.dur){
      if(s.start<=0.0001){ vis=(st>s.dur-OUT)?(s.dur-st)/OUT:1; }   // loud open: scene A live on frame 0
      else if(st<IN)vis=st/IN; else if(st>s.dur-OUT)vis=(s.dur-st)/OUT; else vis=1;
    }
    vis=clamp(vis);s.el.style.opacity=vis;s.el.style.visibility=vis>0.002?'visible':'hidden';
    s.el.style.transform=vis>0.002?'scale('+lerp(1.03,1,clamp(st/0.35)).toFixed(3)+')':'none';
    if(vis>0.002)sceneAnim(s,st);
  });
};
window.seek(0);document.title='ready';
</script>
</body>
</html>
